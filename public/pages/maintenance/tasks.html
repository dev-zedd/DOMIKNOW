<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Tasks - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <style>
        .list-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            overflow-x: auto;
            margin-top: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9375rem;
        }
        th {
            font-weight: 700;
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
        }
        td {
            padding: 1.15rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        tr:hover td {
            background-color: var(--bg-primary);
        }
        .action-btn {
            padding: 0.45rem 1.1rem;
            font-size: 0.8125rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 750;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-block;
            background-color: var(--maintenance);
            color: white;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        
        .filters-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            font-size: 0.8125rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: var(--maintenance);
            color: white;
            border-color: var(--maintenance);
        }
    </style>
    <link href="../../css/design-system.css?v=20260827-1" rel="stylesheet">
    <script src="../../js/ui.js?v=20260827-2" defer></script>
</head>
<body class="app-loading" data-role="maintenance" data-page-title="My Assigned Tasks">
    <!-- Navbar -->
    <nav class="navbar navbar-maintenance">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-maintenance">Maintenance</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="tasks.html" class="navbar-menu-link active">Assigned Tasks</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <h2>Task queue</h2>
        <p class="maintenance-page-lead">Review offers, update active work, and open completed work orders.</p>

        <div class="maintenance-queue-toolbar">
            <label>Search tasks<input id="taskSearch" type="search" placeholder="Property, unit or problem"></label>
            <label>Priority<select id="taskPriority"><option value="all">All priorities</option><option value="low">Low</option><option value="normal">Normal</option><option value="medium">Medium</option><option value="high">High</option><option value="emergency">Emergency</option></select></label>
            <button id="refreshTasks" type="button" class="btn btn-secondary">Refresh tasks</button>
        </div>
        <p id="taskResultCount" role="status" class="maintenance-task-meta"></p>
        <div class="filters-group">
            <button class="filter-btn active" data-filter="all" aria-pressed="true">All tasks</button>
            <button class="filter-btn" data-filter="assigned" aria-pressed="false">New offers</button>
            <button class="filter-btn" data-filter="accepted" aria-pressed="false">Accepted</button>
            <button class="filter-btn" data-filter="in_progress" aria-pressed="false">Working</button>
            <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
            <button class="filter-btn" data-filter="closed" aria-pressed="false">Closed</button>
        </div>

        <div class="list-card">
            <table class="maintenance-data-table" aria-label="Assigned maintenance tasks">
                <thead>
                    <tr>
                        <th>Property & Unit</th>
                        <th>Problem Summary</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Task Status</th>
                        <th>Assigned Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody" aria-live="polite" aria-busy="true">
                    <tr>
                        <td colspan="7" role="status" class="maintenance-table-message">Loading assigned tasks...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js?v=20260827-1"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');
        let myTasks = [];
        let activeFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            fetchAssignedTasks();
            document.getElementById('taskSearch').addEventListener('input', renderTasksTable);
            document.getElementById('taskPriority').addEventListener('change', renderTasksTable);
            document.getElementById('refreshTasks').addEventListener('click', fetchAssignedTasks);

            document.querySelector('.filters-group').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-filter]');
                if (!btn) return;

                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');

                activeFilter = btn.dataset.filter;
                renderTasksTable();
            });
        });

        async function fetchAssignedTasks() {
            const tableBody = document.getElementById('tasksTableBody');
            tableBody.setAttribute('aria-busy', 'true');
            document.getElementById('refreshTasks').disabled = true;
            try {
                const response = await fetch('/api/maintenance/requests/worker', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    renderTaskMessage('Assigned tasks could not be loaded.', 'error', true);
                    return;
                }

                const result = await response.json();
                myTasks = result.data || [];
                renderTasksTable();
                tableBody.setAttribute('aria-busy', 'false');

            } catch (err) {
                console.error(err);
                renderTaskMessage('The maintenance service could not be reached. Check your connection and try again.', 'error', true);
            } finally {
                document.getElementById('refreshTasks').disabled = false;
            }
        }

        function renderTasksTable() {
            const tableBody = document.getElementById('tasksTableBody');
            
            const query = document.getElementById('taskSearch').value.trim().toLowerCase();
            const priority = document.getElementById('taskPriority').value;
            const filtered = myTasks.filter(t => {
                if (priority !== 'all' && (t.priority_level || 'normal') !== priority) return false;
                if (query && ![t.properties?.property_name, t.unit_number, t.issue_title, t.issue_category].join(' ').toLowerCase().includes(query)) return false;
                if (activeFilter === 'all') return true;
                if (activeFilter === 'in_progress') {
                    return ['travelling', 'arrived', 'repairing'].includes(t.status);
                }
                if (activeFilter === 'completed') {
                    return ['completed', 'verified'].includes(t.status);
                }
                return t.status === activeFilter;
            });

            document.getElementById('taskResultCount').textContent = `${filtered.length} of ${myTasks.length} tasks`;
            if (filtered.length === 0) {
                renderTaskMessage('No maintenance tasks match this filter. Select another status to view more work.');
                return;
            }

            tableBody.innerHTML = '';
            filtered.forEach(task => {
                let priorityBadgeClass = 'status-pending';
                if (task.priority_level === 'high' || task.priority_level === 'emergency') priorityBadgeClass = 'status-rejected';
                else if (task.priority_level === 'low') priorityBadgeClass = 'status-active';

                let statusBadgeClass = 'status-pending';
                if (['completed', 'verified', 'closed'].includes(task.status)) statusBadgeClass = 'status-active';
                else if (task.status === 'rejected') statusBadgeClass = 'status-rejected';

                const assignedDate = task.created_at
                    ? new Date(task.created_at).toLocaleDateString('en-PH')
                    : 'Not recorded';
                const taskStatus = String(task.status || 'assigned').replaceAll('_', ' ');
                const actionLabel = ['verified', 'closed'].includes(task.status)
                    ? 'View details'
                    : task.status === 'assigned'
                        ? 'Review offer'
                        : task.status === 'completed'
                            ? 'View report'
                            : 'Update progress';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td data-label="Property and unit">
                        <div class="maintenance-task-property">${window.domiknowEscapeHtml(task.properties?.property_name || 'Property not specified')}</div>
                        <div class="maintenance-task-meta">Unit: ${window.domiknowEscapeHtml(task.unit_number || 'Not specified')}</div>
                    </td>
                    <td data-label="Problem and schedule">
                        <div class="maintenance-task-title">${window.domiknowEscapeHtml(task.issue_title || 'Maintenance request')}</div>
                        <div class="maintenance-task-meta">Preferred schedule: ${window.domiknowEscapeHtml(task.preferred_schedule || 'Not specified')}</div>
                    </td>
                    <td data-label="Category" class="maintenance-task-capitalize">${window.domiknowEscapeHtml(task.issue_category || 'Other')}</td>
                    <td data-label="Priority"><span class="status-badge ${priorityBadgeClass}">${window.domiknowEscapeHtml(task.priority_level || 'Normal')}</span></td>
                    <td data-label="Status"><span class="status-badge ${statusBadgeClass}">${window.domiknowEscapeHtml(taskStatus)}</span></td>
                    <td data-label="Assigned">${assignedDate}</td>
                    <td data-label="Action">
                        <a href="task-details.html?id=${encodeURIComponent(task.id)}" class="action-btn">${actionLabel}</a>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function renderTaskMessage(message, type = 'empty', retry = false) {
            const tableBody = document.getElementById('tasksTableBody');
            const row = document.createElement('tr');
            const cell = document.createElement('td');
            cell.colSpan = 7;
            cell.className = `maintenance-table-message maintenance-table-message--${type}`;
            cell.setAttribute('role', type === 'error' ? 'alert' : 'status');

            const copy = document.createElement('span');
            copy.textContent = message;
            cell.appendChild(copy);

            if (retry) {
                const retryButton = document.createElement('button');
                retryButton.type = 'button';
                retryButton.className = 'btn btn-secondary maintenance-retry-button';
                retryButton.textContent = 'Try again';
                retryButton.addEventListener('click', fetchAssignedTasks, { once: true });
                cell.appendChild(retryButton);
            }

            row.appendChild(cell);
            tableBody.replaceChildren(row);
            tableBody.setAttribute('aria-busy', 'false');
        }
    </script>
</body>
</html>
