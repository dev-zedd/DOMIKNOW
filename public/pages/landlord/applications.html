<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Applications - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <style>
        .table-card {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            margin-bottom: 2rem;
            overflow-x: auto;
        }
        table.landlord-data-table {
            width: 100%;
            min-width: 820px;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9375rem;
        }
        table.landlord-data-table th {
            font-weight: 700;
            color: var(--color-text-secondary);
            padding: 0.875rem 1rem;
            background: var(--color-bg-subtle);
            border-bottom: 1px solid var(--color-border-default);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        table.landlord-data-table td {
            padding: 1.1rem 1rem;
            border-bottom: 1px solid var(--color-divider);
            color: var(--color-text-primary);
            vertical-align: middle;
        }
        table.landlord-data-table tr:hover td {
            background-color: var(--color-bg-hover);
        }
        table.landlord-data-table td.table-empty-cell {
            padding: 0 !important;
            border-bottom: none !important;
            background: transparent !important;
            text-align: center !important;
        }
        table.landlord-data-table td.table-empty-cell:hover {
            background: transparent !important;
        }
        .empty-state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            width: 100%;
        }
        .empty-state-container .empty-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--color-bg-subtle);
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }
        .empty-state-container h3 {
            margin: 0 0 0.5rem;
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--color-text-primary);
        }
        .empty-state-container p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            max-width: 440px;
            line-height: 1.5;
        }
    </style>
    <link href="../../css/design-system.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>
<body class="app-loading" data-role="landlord" data-page-title="Tenant Applications">
    <!-- Navbar -->
    <nav class="navbar navbar-landlord">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-landlord">Landlord</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="properties.html" class="navbar-menu-link">Properties</a>
                <a href="property-create.html" class="navbar-menu-link">Register Property</a>
                <a href="applications.html" class="navbar-menu-link active">Tenant Applications</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <div class="table-card">
            <table class="landlord-data-table landlord-record-table">
                <colgroup>
                    <col style="width: 23%;">
                    <col style="width: 23%;">
                    <col style="width: 14%;">
                    <col style="width: 10%;">
                    <col style="width: 12%;">
                    <col style="width: 9%;">
                    <col style="width: 9%;">
                </colgroup>
                <thead>
                    <tr>
                        <th scope="col" style="width: 23%;">Applicant</th>
                        <th scope="col" style="width: 23%;">Target Property</th>
                        <th scope="col" style="width: 14%;">Desired Move-in</th>
                        <th scope="col" style="width: 10%; text-align: center;">Docs Attached</th>
                        <th scope="col" style="width: 12%;">Submitted Date</th>
                        <th scope="col" style="width: 9%;">Status</th>
                        <th scope="col" style="width: 9%; text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="applicationsTableBody">
                    <tr>
                        <td colspan="7" class="table-empty-cell">
                            <div class="empty-state-container" style="padding: 3rem 2rem;">
                                <p style="color: var(--color-text-muted); font-size: 0.875rem;">Loading tenant applications...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            fetchTenantApplications();
        });

        function domiknowEscapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function fetchTenantApplications() {
            const tableBody = document.getElementById('applicationsTableBody');
            try {
                const response = await fetch('/api/landlord/applications', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="table-empty-cell">
                                <div class="empty-state-container">
                                    <p style="color: var(--color-error, #ef4444); font-size: 0.875rem;">Failed to load applications. Please try again.</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                const result = await response.json();
                const applications = result.data || [];

                if (applications.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="table-empty-cell">
                                <div class="empty-state-container">
                                    <div class="empty-icon">
                                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                                        </svg>
                                    </div>
                                    <h3>No Applications Received</h3>
                                    <p>When tenants discover your approved listings and apply, they will appear here.</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = '';
                applications.forEach(app => {
                    // Status styling
                    let statusClass = 'status-pending';
                    if (app.status === 'approved') statusClass = 'status-active';
                    if (app.status === 'rejected') statusClass = 'status-rejected';

                    // Format dates
                    const moveInDate = app.desired_move_in_date ? new Date(app.desired_move_in_date).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    }) : 'N/A';
                    const submittedDate = app.created_at ? new Date(app.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    }) : 'N/A';

                    const tName = app.users ? app.users.full_name : 'Unknown';
                    const tEmail = app.users ? app.users.email : 'N/A';
                    const pName = app.properties ? app.properties.property_name : 'N/A';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            <div style="font-weight: 700; color: var(--color-text-primary); font-size: 0.9375rem;">${domiknowEscapeHtml(tName)}</div>
                            <div style="font-size: 0.75rem; color: var(--color-text-muted); margin-top: 2px;">${domiknowEscapeHtml(tEmail)}</div>
                        </td>
                        <td>
                            <div style="font-weight: 600; color: var(--color-text-primary); font-size: 0.875rem;">${domiknowEscapeHtml(pName)}</div>
                            ${(app.unit || app.property_units) ? `<div style="font-size: 0.75rem; color: var(--color-text-muted); font-weight: 600; margin-top: 2px;">Room: ${domiknowEscapeHtml(String((app.unit || app.property_units).unit_number))}${(app.bed || app.unit_beds) ? ` - ${domiknowEscapeHtml(String((app.bed || app.unit_beds).bed_label))}` : ''}</div>` : ''}
                        </td>
                        <td style="font-weight: 600; font-size: 0.875rem; color: var(--color-text-secondary); white-space: nowrap;">${moveInDate}</td>
                        <td style="text-align: center; font-weight: 700; color: var(--color-link);">${app.document_count || 0}</td>
                        <td style="font-size: 0.875rem; color: var(--color-text-secondary); white-space: nowrap;">${submittedDate}</td>
                        <td><span class="status-badge ${statusClass}">${domiknowEscapeHtml(app.status)}</span></td>
                        <td style="text-align: right;">
                            <a href="application-details.html?id=${encodeURIComponent(app.id)}" class="btn-primary" style="display: inline-block; width: auto; padding: 0.45rem 1rem; font-size: 0.8125rem; font-weight: 700; text-decoration: none; border-radius: var(--radius-md); background-color: var(--color-action-primary, #0355f3); color: #fff;">Review</a>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="table-empty-cell">
                            <div class="empty-state-container">
                                <p style="color: var(--color-error, #ef4444); font-size: 0.875rem;">Error contacting database servers.</p>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }
    </script>
</body>
</html>
