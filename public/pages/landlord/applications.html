<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Applications - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <style>
        .app-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9375rem;
        }
        th {
            font-weight: 700;
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        tr:hover td {
            background-color: var(--bg-primary);
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
    </style>
    <link href="../../css/design-system.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-landlord">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-landlord">Landlord</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="properties.html" class="navbar-menu-link">My Properties</a>
                <a href="property-create.html" class="navbar-menu-link">Register Property</a>
                <a href="applications.html" class="navbar-menu-link active">Tenant Applications</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <h2>Tenant Applications</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Review rental applications submitted for your approved properties.</p>

        <div class="app-card">
            <table>
                <thead>
                    <tr>
                        <th>Applicant</th>
                        <th>Target Property</th>
                        <th>Desired Move-in</th>
                        <th>Docs Attached</th>
                        <th>Submitted Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="applicationsTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted);">Loading tenant applications...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            fetchTenantApplications();
        });

        async function fetchTenantApplications() {
            const tableBody = document.getElementById('applicationsTableBody');
            try {
                const response = await fetch('/api/landlord/applications', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--error);">Failed to load applications.</td></tr>`;
                    return;
                }

                const result = await response.json();
                const applications = result.data || [];

                if (applications.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <span style="font-size: 2.5rem;">📁</span>
                                <h3 style="margin-top: 0.5rem; color: var(--text-secondary);">No Applications Received</h3>
                                <p style="font-size: 0.875rem;">When tenants discover your approved listings and apply, they will appear here.</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = '';
                applications.forEach(app => {
                    // Status styling
                    let statusClass = 'status-pending';
                    if (app.status === 'approved') statusClass = 'status-active';
                    if (app.status === 'rejected') statusClass = 'status-rejected';

                    // Format dates
                    const moveInDate = new Date(app.desired_move_in_date).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });
                    const submittedDate = new Date(app.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });

                    const tName = app.users ? app.users.full_name : 'Unknown';
                    const tEmail = app.users ? app.users.email : 'N/A';
                    const pName = app.properties ? app.properties.property_name : 'N/A';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            <div style="font-weight: 700; color: var(--text-primary);">${tName}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${tEmail}</div>
                        </td>
                        <td>
                            <div style="font-weight: 600;">${pName}</div>
                            ${(app.unit || app.property_units) ? `<div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Room: ${(app.unit || app.property_units).unit_number}${(app.bed || app.unit_beds) ? ` - ${(app.bed || app.unit_beds).bed_label}` : ''}</div>` : ''}
                        </td>
                        <td style="font-weight: 600;">${moveInDate}</td>
                        <td style="text-align: center; font-weight: 700; color: var(--primary);">${app.document_count || 0}</td>
                        <td>${submittedDate}</td>
                        <td><span class="status-badge ${statusClass}">${app.status}</span></td>
                        <td>
                            <a href="application-details.html?id=${app.id}" class="btn-primary" style="width: auto; padding: 0.45rem 1rem; font-size: 0.8125rem; text-decoration: none; background-color: var(--landlord);">Review</a>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--error);">Error contacting database servers.</td></tr>`;
            }
        }
    </script>
</body>
</html>
