<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <style>
        .app-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9375rem;
        }
        th {
            font-weight: 700;
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        tr:hover td {
            background-color: var(--bg-primary);
        }
        .remarks-text {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 0.25rem;
            max-width: 200px;
            white-space: normal;
            word-wrap: break-word;
        }
    </style>
    <link href="../../css/design-system.css?v=20260905-1" rel="stylesheet">
    <script src="../../js/ui.js?v=20260827-3" defer></script>
</head>
<body class="app-loading" data-role="tenant" data-page-title="My Applications">
    <!-- Navbar -->
    <nav class="navbar navbar-tenant">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-tenant">Tenant</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="properties.html" class="navbar-menu-link">Discovery</a>
                <a href="applications.html" class="navbar-menu-link active">My Applications</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">


        <div class="app-card">
            <table>
                <thead>
                    <tr>
                        <th>Property Details</th>
                        <th>Landlord</th>
                        <th>Expected Move-In</th>
                        <th>Landlord Review Notes</th>
                        <th>Date Submitted</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="applicationsTableBody" aria-live="polite" aria-busy="true">
                    <tr>
                        <td colspan="7" role="status" style="text-align: center; color: var(--text-muted);">Loading your applications...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js?v=20260905-1"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            fetchTenantApplications();
        });

        async function fetchTenantApplications() {
            const tableBody = document.getElementById('applicationsTableBody');
            try {
                const response = await fetch('/api/tenant/applications/my', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    tableBody.innerHTML = `<tr><td colspan="7" role="alert" style="text-align: center; color: var(--error);">Your applications could not be loaded. Please try again.</td></tr>`;
                    tableBody.setAttribute('aria-busy', 'false');
                    return;
                }

                const result = await response.json();
                const applications = result.data || [];

                if (applications.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" role="status" style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
                                You have not submitted any rental applications yet.
                                Find approved properties to apply in <a href="properties.html" class="auth-link">Discovery</a>!
                            </td>
                        </tr>
                    `;
                    tableBody.setAttribute('aria-busy', 'false');
                    return;
                }

                tableBody.innerHTML = '';
                applications.forEach(app => {
                    // Status Badge Styling
                    let statusKey = (app.status || 'pending').toLowerCase();
                    let statusLabel = statusKey.charAt(0).toUpperCase() + statusKey.slice(1);
                    let statusClass = 'status-pending';
                    if (statusKey === 'approved') statusClass = 'status-approved';
                    else if (statusKey === 'rejected' || statusKey === 'cancelled') statusClass = 'status-rejected';

                    // Format dates
                    const moveInDate = app.desired_move_in_date ? new Date(app.desired_move_in_date).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    }) : 'N/A';
                    const submittedDate = app.created_at ? new Date(app.created_at).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    }) : 'N/A';

                    const pName = app.properties ? app.properties.property_name : 'N/A';
                    const pAddress = app.properties ? app.properties.address : 'N/A';
                    const lName = app.properties && app.properties.users ? app.properties.users.full_name : 'N/A';

                    let targetUnitText = '';
                    const targetUnit = app.unit || app.property_units;
                    const targetBed = app.bed || app.unit_beds;
                    if (targetUnit) {
                        targetUnitText = `Room ${targetUnit.unit_number}`;
                        if (targetBed) {
                            targetUnitText += ` • ${targetBed.bed_label}`;
                        }
                    }

                    const row = document.createElement('tr');
                    row.className = 'app-row-card';
                    row.innerHTML = `
                        <td class="app-cell-property" data-label="Property Details">
                            <div class="app-property-wrapper">
                                <div class="app-property-icon ${statusClass}">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 21h18"/>
                                        <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
                                        <path d="M9 7h1"/><path d="M9 11h1"/><path d="M9 15h1"/>
                                        <path d="M14 7h1"/><path d="M14 11h1"/><path d="M14 15h1"/>
                                    </svg>
                                </div>
                                <div class="app-property-text">
                                    <div class="app-property-name">${domiknowEscapeHtml(pName)}</div>
                                    <div class="app-property-unit">${targetUnitText ? domiknowEscapeHtml(targetUnitText) : domiknowEscapeHtml(pAddress)}</div>
                                </div>
                            </div>
                        </td>
                        <td class="app-cell-landlord" data-label="Landlord">
                            <span class="app-col-label">Landlord</span>
                            <span class="app-col-val">${domiknowEscapeHtml(lName)}</span>
                        </td>
                        <td class="app-cell-movein" data-label="Expected Move-In">
                            <span class="app-col-label">Expected Move-In</span>
                            <span class="app-col-val">${moveInDate}</span>
                        </td>
                        <td class="app-cell-notes" data-label="Landlord Review Notes">
                            <span class="app-col-label">Landlord Review Notes</span>
                            <span class="app-col-val remarks-text">${app.landlord_remarks ? domiknowEscapeHtml(app.landlord_remarks) : 'Awaiting review'}</span>
                        </td>
                        <td class="app-cell-submitted" data-label="Date Submitted">
                            <span class="app-col-label">Date Submitted</span>
                            <span class="app-col-val">${submittedDate}</span>
                        </td>
                        <td class="app-cell-status" data-label="Status">
                            <span class="app-col-label">Status</span>
                            <span class="status-badge app-status-badge ${statusClass}">
                                <span class="app-status-dot"></span>
                                ${domiknowEscapeHtml(statusLabel)}
                            </span>
                        </td>
                        <td class="app-cell-action" data-label="Action">
                            <a href="application-details.html?id=${encodeURIComponent(app.id)}" class="app-action-btn">
                                View Details
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"/>
                                </svg>
                            </a>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
                tableBody.setAttribute('aria-busy', 'false');

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="7" role="alert" style="text-align: center; color: var(--error);">The application service could not be reached. Check your connection and try again.</td></tr>`;
                tableBody.setAttribute('aria-busy', 'false');
            }
        }
    </script>
</body>
</html>
