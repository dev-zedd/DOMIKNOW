<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Profile - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <!-- Leaflet.js map components -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Prevent layout flashing shift on page load */
        body:not(.app-ready) {
            visibility: hidden;
            opacity: 0;
        }
        body.app-ready {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.15s ease-in;
        }

        /* Viewport lock override */
        body, html {
            overflow: hidden !important;
            height: 100vh !important;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .main-content-inner {
            height: calc(100vh - 72px) !important;
            min-height: calc(100vh - 72px) !important;
            padding: 0.5rem 1.5rem 0.5rem 1.5rem !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden !important;
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-top: 0 !important;
            max-width: 100% !important;
        }

        .navbar-brand-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .breadcrumb-nav {
            font-size: 0.8rem;
            font-weight: 500;
            color: #64748b;
            display: inline-flex;
            align-items: center;
        }
        
        .breadcrumb-nav a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
        }
        
        .breadcrumb-nav a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        
        .breadcrumb-separator {
            margin: 0 0.35rem;
            color: #94a3b8;
            font-weight: 400;
        }
        
        .breadcrumb-current {
            color: #64748b;
            font-weight: 500;
        }

        #propertyDetailsContent {
            flex-grow: 1;
            height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1.7fr 1.3fr;
            gap: 0.75rem;
            flex-grow: 1;
            height: 0;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .detail-grid {
                grid-template-columns: 1fr;
                height: auto;
                overflow-y: auto;
            }
            body, html {
                overflow: auto;
            }
            .dashboard-container {
                height: auto;
                overflow: auto;
            }
            #propertyDetailsContent {
                height: auto;
                overflow: auto;
            }
        }

        .detail-main {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            height: 100%;
            overflow: hidden;
        }

        .detail-sidebar {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            height: 100%;
            overflow: hidden;
        }

        .detail-header-compact {
            display: flex;
            gap: 1rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.5rem 0.85rem;
            align-items: center;
            flex-shrink: 0;
        }

        .detail-header-compact img {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .detail-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .detail-meta-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.25rem;
        }

        .detail-pill {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .detail-pill-type {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .detail-pill-suit {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
        }

        .detail-pill-price {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #dcfce7;
        }

        /* Tabbed description / amenities / rules container */
        .tabbed-card {
            display: flex;
            flex-direction: column;
            height: 120px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .tab-headers {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }

        .tab-btn:hover {
            color: #0f172a;
            background-color: #f1f5f9;
        }

        .tab-btn.active {
            color: #0f172a;
            border-bottom-color: #0f172a;
            background-color: #ffffff;
        }

        .tab-content-box {
            padding: 0.85rem;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 0.85rem;
            color: #334155;
            line-height: 1.5;
        }

        /* Rooms section filling remaining height */
        .rooms-card {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem;
            overflow: hidden;
        }

        .rooms-scrollable-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 0.5rem;
            padding-right: 2px;
        }

        .room-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .room-card-item {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            transition: border-color 0.15s;
        }

        .room-card-item:hover {
            border-color: #cbd5e1;
        }

        .room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .room-card-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .room-card-subtitle {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .room-card-specs {
            font-size: 0.8rem;
            color: #475569;
        }

        .room-card-amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .room-card-amenity-tag {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            color: #475569;
            font-weight: 500;
        }

        .bed-list-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .bed-list-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        .bed-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 0.4rem 0.6rem;
            border-radius: 5px;
            font-size: 0.78rem;
        }

        .bed-list-item span {
            font-weight: 500;
        }

        .bed-list-item .bed-rent {
            font-weight: 700;
            color: #0f172a;
        }

        .btn-action-apply {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 5px;
            border: 1px solid #0f172a;
            cursor: pointer;
            transition: background-color 0.15s;
            text-decoration: none;
        }

        .btn-action-apply:hover {
            background-color: #1e293b;
        }

        .btn-action-apply-small {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            border: 1px solid #0f172a;
            cursor: pointer;
        }

        .btn-action-apply-small:hover {
            background-color: #1e293b;
        }

        .btn-action-disabled {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #f1f5f9;
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 5px;
            border: 1px solid #e2e8f0;
            cursor: not-allowed;
            text-decoration: none;
        }

        /* Sidebar styles */
        .map-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.85rem;
            flex-shrink: 0;
        }

        .feedback-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem;
            flex-grow: 1;
            height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .feedback-scrollable-content {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 0.5rem;
            padding-right: 2px;
        }

        .detail-amenity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5rem;
        }

        .detail-amenity-item {
            font-size: 0.8rem;
            color: #334155;
            background: #f8fafc;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            font-weight: 500;
            text-align: center;
        }

        .profile-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            margin: 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .feedback-bullets {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .feedback-bullet {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .feedback-bullet-pos {
            background-color: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #14532d;
        }

        .feedback-bullet-neg {
            background-color: #fffbeb;
            border: 1px solid #fef3c7;
            color: #78350f;
        }

        /* Custom Scrollbar Styles for elegant UI */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <link href="../../css/design-system.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-tenant">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <div class="breadcrumb-nav" style="font-size: 0.95rem; font-weight: 700; display: flex; align-items: center;">
                    <a href="properties.html" style="color: #0f172a; text-decoration: none;">Discovery</a>
                    <span class="breadcrumb-separator" style="color: #94a3b8; margin: 0 0.5rem; font-weight: 400;">&gt;</span>
                    <span class="breadcrumb-current" style="color: #64748b; font-weight: 500;">Property Details</span>
                </div>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <div id="propertyDetailsContent">
            <p style="text-align: center; color: var(--text-muted); margin-top: 4rem;">Loading property details...</p>
        </div>
    </main>



    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', () => {
            if (!propertyId) {
                document.getElementById('propertyDetailsContent').innerHTML = `<p style="text-align: center; color: var(--error);">Missing Property ID parameter in URL.</p>`;
                return;
            }

            // Instantly override topbar title with breadcrumbs to prevent flashing "Property Profile"
            const initialTopbarTitle = document.querySelector('.topbar-title');
            if (initialTopbarTitle) {
                initialTopbarTitle.innerHTML = `
                    <div class="breadcrumb-nav" style="font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 0.35rem;">
                        <a href="properties.html" style="color: #0f172a; text-decoration: none;">Discovery</a>
                        <span class="breadcrumb-separator" style="color: #94a3b8; font-weight: 400;">&gt;</span>
                        <span class="breadcrumb-current" style="color: #64748b; font-weight: 500;">Property Details</span>
                    </div>
                `;
            }

            fetchPropertyProfile();
        });

        async function fetchPropertyProfile() {
            try {
                // PUBLIC API - no auth required for viewing property details
                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch(`/api/properties/${propertyId}`, { headers });

                if (!response.ok) {
                    document.getElementById('propertyDetailsContent').innerHTML = `<p style="text-align: center; color: var(--error);">Failed to load property details. It may not exist.</p>`;
                    return;
                }

                const result = await response.json();
                const prop = result.data;

                const topbarTitle = document.querySelector('.topbar-title');
                if (topbarTitle) {
                    topbarTitle.innerHTML = `
                        <div class="breadcrumb-nav" style="font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 0.35rem;">
                            <a href="properties.html" style="color: #0f172a; text-decoration: none;">Discovery</a>
                            <span class="breadcrumb-separator" style="color: #94a3b8; font-weight: 400;">&gt;</span>
                            <span class="breadcrumb-current" style="color: #64748b; font-weight: 500;">Property Details</span>
                        </div>
                    `;
                }

                renderProfileUI(prop);

            } catch (err) {
                console.error(err);
                document.getElementById('propertyDetailsContent').innerHTML = `<p style="text-align: center; color: var(--error);">Error reaching property api.</p>`;
            }
        }

        function renderProfileUI(prop) {
            const container = document.getElementById('propertyDetailsContent');

            // Format amenities items (no emojis!)
            let amenityItemsHtml = '';
            if (prop.amenities && prop.amenities.length > 0) {
                prop.amenities.forEach(a => {
                    amenityItemsHtml += `<div class="detail-amenity-item">${a}</div>`;
                });
            } else {
                amenityItemsHtml = '<p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">No specific amenities listed.</p>';
            }

            // Format feedback reviews summary (no emojis!)
            let feedbackSummaryHtml = '';
            if (prop.feedback_summary) {
                feedbackSummaryHtml = `
                    <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem; color: #0f172a; display: flex; align-items: center; gap: 4px;">
                        ★ ${parseFloat(prop.feedback_summary.rating_average).toFixed(1)} 
                        <span style="color: var(--text-muted); font-weight: 500; font-size: 0.8rem;">(${prop.feedback_summary.total_feedback} ratings)</span>
                    </div>
                    <div class="feedback-bullets">
                        <div class="feedback-bullet feedback-bullet-pos">
                            <strong>Positive Highlights:</strong><br>${prop.feedback_summary.positive_summary || 'N/A'}
                        </div>
                        <div class="feedback-bullet feedback-bullet-neg">
                            <strong>Minor Drawbacks:</strong><br>${prop.feedback_summary.negative_summary || 'N/A'}
                        </div>
                    </div>
                `;
            } else {
                feedbackSummaryHtml = `
                    <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: #0f172a; display: flex; align-items: center; gap: 4px;">
                        ★ ${parseFloat(prop.average_rating).toFixed(1)} 
                        <span style="color: var(--text-muted); font-weight: 500; font-size: 0.8rem;">(No detailed reviews yet)</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.8rem; font-style: italic; margin-top: 0.5rem;">Detailed feedback reports will populate as active ratings are processed.</p>
                `;
            }

            // Parse rules - handle both plain text and JSON-encoded formats
            let rulesHtml = '<li>No explicit rules provided. General residential codes apply.</li>';
            if (prop.house_rules) {
                let rawRules = prop.house_rules;
                let parsedPolicies = [];

                // Try to parse as JSON (API sometimes returns a JSON-encoded object)
                try {
                    const parsed = typeof rawRules === 'string' ? JSON.parse(rawRules) : rawRules;
                    if (parsed && typeof parsed === 'object') {
                        // Extract the plain house_rules text
                        if (parsed.house_rules) {
                            rawRules = parsed.house_rules;
                        }
                        // Extract custom_policies
                        if (Array.isArray(parsed.custom_policies)) {
                            parsedPolicies = parsed.custom_policies;
                        }
                    }
                } catch (e) {
                    // Not JSON — treat as plain text string
                }

                // Render main rule text as bullet points (split by period or newline)
                const ruleLines = rawRules
                    .split(/\.\s+|\n/)
                    .map(r => r.trim())
                    .filter(r => r.length > 0);

                rulesHtml = ruleLines.map(r => `<li>${r}</li>`).join('');

                // Append custom policies as additional items
                if (parsedPolicies.length > 0) {
                    rulesHtml += parsedPolicies
                        .map(p => `<li><strong>${p.name}:</strong> ${p.value}</li>`)
                        .join('');
                }
            }

            // Format Units / Rooms section
            let unitsListHtml = '';
            const units = prop.units || [];
            if (units.length > 0) {
                unitsListHtml = `<div class="room-card-grid">`;
                units.forEach(u => {
                    const statusClass = u.status === 'available' ? 'status-active' : u.status === 'occupied' ? 'status-rejected' : 'status-pending';
                    const unitAmenities = (u.amenities || []).map(am => `<span class="room-card-amenity-tag">${am}</span>`).join(' ');
                    
                    let bedsListHtml = '';
                    if (u.rental_style === 'per_bed') {
                        const beds = u.beds || [];
                        bedsListHtml = `
                            <div class="bed-list-container">
                                <div class="bed-list-title">Bed Spaces:</div>
                                ${beds.map(bed => {
                                    const isAvailable = bed.status === 'available';
                                    let actionBtnHtml = '';
                                    
                                    if (token) {
                                        if (isAvailable) {
                                            actionBtnHtml = `<button class="btn-action-apply-small btn-apply-bed-trigger" data-unit-id="${u.id}" data-bed-id="${bed.id}" data-unit-num="${u.unit_number}" data-bed-label="${bed.bed_label}">Apply</button>`;
                                        } else {
                                            actionBtnHtml = `<span class="status-pill status-${bed.status}" style="font-size: 0.68rem; text-transform: capitalize; padding: 1px 6px;">${bed.status}</span>`;
                                        }
                                    } else {
                                        actionBtnHtml = `<button class="btn-action-apply-small btn-login-trigger">Login</button>`;
                                    }
                                    
                                    return `
                                        <div class="bed-list-item">
                                            <span>${bed.bed_label}</span>
                                            <div style="display: flex; align-items: center; gap: 8px;">
                                                <span class="bed-rent">₱${parseFloat(bed.monthly_rent).toLocaleString()}</span>
                                                ${actionBtnHtml}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `;
                    }

                    let actionsAreaHtml = '';
                    if (u.rental_style === 'per_bed') {
                        actionsAreaHtml = bedsListHtml;
                    } else {
                        actionsAreaHtml = `
                            <div style="margin-top: auto; padding-top: 0.5rem;">
                                ${token && u.status === 'available' ? `
                                    <button class="btn-action-apply btn-apply-unit-trigger" data-unit-id="${u.id}" data-unit-num="${u.unit_number}">Apply for ${u.unit_number}</button>
                                ` : u.status === 'available' ? `
                                    <button class="btn-action-apply btn-login-trigger">Login to Apply</button>
                                ` : `
                                    <button disabled class="btn-action-disabled">Currently ${u.status}</button>
                                `}
                            </div>
                        `;
                    }
                    
                    unitsListHtml += `
                        <div class="room-card-item">
                            <div class="room-card-header">
                                <div>
                                    <h4 class="room-card-title">${u.unit_number}</h4>
                                    <span class="room-card-subtitle">${u.unit_type.replace('_', ' ').toUpperCase()} • ${u.floor_area_sqm || 20} sqm</span>
                                </div>
                                <span class="status-badge ${statusClass}">${u.status}</span>
                            </div>
                            
                            <div class="room-card-specs">
                                <p style="margin: 0 0 0.25rem 0;"><strong>Rent:</strong> <span style="color: var(--landlord); font-weight: 700;">₱${parseInt(u.monthly_rent).toLocaleString()}</span> / mo</p>
                                <p style="margin: 0 0 0.25rem 0;"><strong>Capacity:</strong> ${u.capacity} persons</p>
                            </div>
 
                            ${unitAmenities ? `<div class="room-card-amenities">${unitAmenities}</div>` : ''}
 
                            ${actionsAreaHtml}
                        </div>
                    `;
                });
                unitsListHtml += `</div>`;
            } else {
                unitsListHtml = '<p style="color: var(--text-muted); font-size: 0.85rem; font-style: italic; margin: 0;">No specific units/rooms listed under this property yet.</p>';
            }

            const rentRange = (() => {
                let rentRangeDisplay = `₱${parseFloat(prop.monthly_rent).toLocaleString()}/mo`;
                if (prop.unit_stats && prop.unit_stats.min_monthly_rent > 0) {
                    const minRent = parseFloat(prop.unit_stats.min_monthly_rent);
                    const maxRent = parseFloat(prop.unit_stats.max_monthly_rent);
                    if (minRent === maxRent) {
                        rentRangeDisplay = `₱${minRent.toLocaleString()}/mo`;
                    } else {
                        rentRangeDisplay = `₱${minRent.toLocaleString()} - ₱${maxRent.toLocaleString()}/mo`;
                    }
                }
                return rentRangeDisplay;
            })();

            container.innerHTML = `
                <div class="detail-grid">
                    <!-- Left Section: Basic details, image, descriptions -->
                    <div class="detail-main">
                        <div class="detail-header-compact">
                            <img src="${prop.main_image_url || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=800&q=80'}" alt="${prop.property_name}">
                            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                                <h2 class="detail-title">${prop.property_name}</h2>
                                <div class="detail-meta-pills">
                                    <span class="detail-pill detail-pill-type">${prop.property_type.replace('_', ' ')}</span>
                                    <span class="detail-pill detail-pill-suit">For: ${prop.tenant_type_suitability}</span>
                                    <span class="detail-pill detail-pill-price">${rentRange}</span>
                                </div>
                                <p style="color: #64748b; font-size: 0.8rem; margin: 0.25rem 0 0 0; font-weight: 500;">Address: ${prop.address}</p>
                            </div>
                        </div>

                        <div class="tabbed-card">
                            <div class="tab-headers">
                                <button class="tab-btn active" data-tab="overview">Overview</button>
                                <button class="tab-btn" data-tab="amenities">Amenities</button>
                                <button class="tab-btn" data-tab="rules">House Rules</button>
                            </div>
                            <div class="tab-content-box" id="tabContentBox">
                                <p style="margin: 0; line-height: 1.6;">${prop.description || 'No description provided.'}</p>
                            </div>
                        </div>

                        <div class="rooms-card">
                            <h3 class="detail-section-title" style="margin: 0; font-size: 1.1rem;">Rooms & Units for Rent</h3>
                            <p style="color: var(--text-muted); font-size: 0.75rem; margin: 0.15rem 0 0.5rem 0;">Select a specific room to submit your application.</p>
                            <div class="rooms-scrollable-container">
                                ${unitsListHtml}
                            </div>
                        </div>
                    </div>


                    <!-- Right Section: Map Pin & Feedback Reviews -->
                    <div class="detail-sidebar">
                        <!-- Location Map -->
                        <div class="map-card">
                            <h3 class="profile-card-title" style="margin-bottom: 0.5rem; font-size: 0.95rem;">Map Location</h3>
                            <div id="detailsMap" style="height: 140px; border-radius: 8px; border: 1px solid var(--border-color); z-index: 1;"></div>
                        </div>

                        <!-- Feedback Summary Card -->
                        <div class="feedback-card">
                            <h3 class="profile-card-title" style="margin-bottom: 0.5rem; font-size: 0.95rem;">Tenant Rating & Feedback Summary</h3>
                            <div class="feedback-scrollable-content">
                                ${feedbackSummaryHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Bind tab switching programmatically
            const tabContents = {
                overview: `<p style="margin: 0; line-height: 1.6;">${prop.description || 'No description provided.'}</p>`,
                amenities: `<div class="detail-amenity-grid">${amenityItemsHtml}</div>`,
                rules: `<ul style="margin: 0; padding-left: 1.25rem; line-height: 1.6;">${rulesHtml}</ul>`
            };

            container.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const tabName = btn.getAttribute('data-tab');
                    container.querySelector('#tabContentBox').innerHTML = tabContents[tabName];
                });
            });

            // Bind listeners programmatically to bypass CSP (script-src-attr 'none')

            container.querySelectorAll('.btn-apply-unit-trigger').forEach(unitBtn => {
                unitBtn.addEventListener('click', () => {
                    const unitId = unitBtn.getAttribute('data-unit-id');
                    window.location.href = `apply.html?id=${prop.id}&unit_id=${unitId}`;
                });
            });

            container.querySelectorAll('.btn-apply-bed-trigger').forEach(bedBtn => {
                bedBtn.addEventListener('click', () => {
                    const unitId = bedBtn.getAttribute('data-unit-id');
                    const bedId = bedBtn.getAttribute('data-bed-id');
                    window.location.href = `apply.html?id=${prop.id}&unit_id=${unitId}&bed_id=${bedId}`;
                });
            });

            container.querySelectorAll('.btn-login-trigger').forEach(loginBtn => {
                loginBtn.addEventListener('click', () => {
                    window.location.href = '../auth/login.html';
                });
            });

            // Render single Leaflet Marker
            if (prop.latitude && prop.longitude) {
                setTimeout(() => {
                    const detailsMap = L.map('detailsMap').setView([prop.latitude, prop.longitude], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(detailsMap);

                    const markerRent = (() => {
                        let rentRangeDisplay = `₱${parseFloat(prop.monthly_rent).toLocaleString()}/mo`;
                        if (prop.unit_stats && prop.unit_stats.min_monthly_rent > 0) {
                            const minRent = parseFloat(prop.unit_stats.min_monthly_rent);
                            const maxRent = parseFloat(prop.unit_stats.max_monthly_rent);
                            if (minRent === maxRent) {
                                rentRangeDisplay = `₱${minRent.toLocaleString()}/mo`;
                            } else {
                                rentRangeDisplay = `₱${minRent.toLocaleString()} - ₱${maxRent.toLocaleString()}/mo`;
                            }
                        }
                        return rentRangeDisplay;
                    })();

                    L.marker([prop.latitude, prop.longitude])
                        .addTo(detailsMap)
                        .bindPopup(`<strong>${prop.property_name}</strong><br>${markerRent}`)
                        .openPopup();
                }, 100);
            }
        }


    </script>
</body>
</html>
