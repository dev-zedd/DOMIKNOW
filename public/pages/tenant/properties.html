<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Discovery - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <!-- Leaflet.js GIS map components -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="../../css/map-system.css" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .compare-bar {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }
        .compare-bar.hidden {
            display: none !important;
        }

        /* ── Map Marker Animations ── */
        .map-top1-pulse {
            animation: pulseGlow 2s infinite ease-in-out;
            z-index: 1000 !important;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.6)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.9)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.6)); }
        }
        .map-marker-bounce {
            animation: markerBounce 0.5s ease-in-out 2;
        }
        @keyframes markerBounce {
            0%, 100% { transform: translateY(0) scale(1.1); }
            50% { transform: translateY(-10px) scale(1.2); }
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .prop-card {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .prop-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            border-color: #4f46e5;
        }
    </style>
    <link href="../../css/design-system.css" rel="stylesheet">
    <link href="../../css/public-refinement.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
    <script src="../../js/map-system.js" defer></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-tenant">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-tenant">Tenant</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="properties.html" class="navbar-menu-link active">Discovery</a>
                <a href="applications.html" class="navbar-menu-link">My Applications</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div id="generalFeedback" class="alert alert-success hidden" style="margin-bottom: 0; padding: 0.5rem 1rem;"></div>
            </div>
        </div>



        <div class="properties-layout">
            <!-- Left Column: Filters -->
            <aside class="filter-card">
                <h3 class="filter-title">Filter Options</h3>
                
                <!-- 1. Preferred location -->
                <div class="filter-section">
                    <label class="form-label" for="filterBarangay">Preferred location</label>
                    <select id="filterBarangay" class="form-select">
                        <option value="">All Barangays in Siniloan</option>
                        <option value="Acevida">Acevida</option>
                        <option value="Bagong Pag-asa">Bagong Pag-asa (Poblacion)</option>
                        <option value="Bagumayan">Bagumayan</option>
                        <option value="Buhay">Buhay</option>
                        <option value="Gen. Luna">Gen. Luna</option>
                        <option value="G. Redor">G. Redor (Poblacion)</option>
                        <option value="Halayhayin">Halayhayin</option>
                        <option value="I. Mendiola">I. Mendiola (Poblacion)</option>
                        <option value="Kalaiya">Kalaiya</option>
                        <option value="Kapatalan">Kapatalan</option>
                        <option value="Laguio">Laguio</option>
                        <option value="Liyang">Liyang</option>
                        <option value="Llavac">Llavac</option>
                        <option value="Macatad">Macatad</option>
                        <option value="Magsaysay">Magsaysay</option>
                        <option value="Maybo">Maybo</option>
                        <option value="Pandeño">Pandeño</option>
                        <option value="Salubungan">Salubungan</option>
                        <option value="Valderrama">Valderrama</option>
                        <option value="Wawa">Wawa</option>
                    </select>
                </div>

                <!-- 2. Budget or rental price range -->
                <div class="filter-section">
                    <label class="form-label">Budget or rental price range</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="number" id="filterMinPrice" placeholder="Min ₱" class="form-input" style="padding: 0.5rem;">
                        <span style="color: var(--text-muted); font-size: 0.8125rem;">to</span>
                        <input type="number" id="filterMaxPrice" placeholder="Max ₱" class="form-input" style="padding: 0.5rem;">
                    </div>
                </div>

                <!-- 3. Preferred property type -->
                <div class="filter-section">
                    <label class="form-label" for="filterType">Preferred property type</label>
                    <select id="filterType" class="form-select">
                        <option value="">All Types</option>
                        <option value="apartment">Apartment</option>
                        <option value="boarding_house">Boarding House</option>
                        <option value="bedspace">Bedspace</option>
                    </select>
                </div>

                <!-- 4. Preferred amenities -->
                <div class="filter-section">
                    <label class="form-label">Preferred amenities</label>
                    <div class="amenity-checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="WiFi"> WiFi</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="CCTV"> CCTV</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Parking"> Parking</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Kitchen Access"> Kitchen Access</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Laundry Area"> Laundry Area</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Air Conditioning"> Aircon</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Own CR"> Own CR</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Study Area"> Study Area</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Near School"> Near School</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Near Market"> Near Market</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Pet Friendly"> Pet Friendly</label>
                    </div>
                </div>

                <button id="btnClearFilters" class="navbar-btn" style="width: 100%; margin-top: 0.5rem; justify-content: center; font-weight: 700; color: var(--primary);">Clear All Filters</button>
            </aside>

            <!-- Right Column: Map and Listings -->
            <div class="discovery-main">
                <!-- GIS Map Card -->
                <div class="map-card">
                    <div id="map" role="application" aria-label="Interactive map of recommended rental properties"></div>
                </div>

                <!-- Catalog Grid -->
                <div id="propertiesGrid" class="property-grid">
                    <p role="status" aria-live="polite" style="text-align: center; color: var(--text-muted); grid-column: 1/-1;">Searching properties...</p>
                </div>
            </div>
        </div>
    </main>



    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');
        let mapInstance = null;
        let markersGroup = null;
        let userLocationMarker = null;
        let selectedPropertyIds = [];
        let allProperties = [];
        let currentPage = 1;
        let totalPages = 1;
        let propertyRequestController = null;
        let filterRequestTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Leaflet Map centered in Siniloan, Laguna
            mapInstance = L.map('map').setView([14.4172, 121.4475], 14);
            if (window.DomiknowMap) DomiknowMap.addBasemap(mapInstance);
            else L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(mapInstance);
            
            markersGroup = L.layerGroup().addTo(mapInstance);

            const mapElement = document.getElementById('map');
            requestAnimationFrame(() => requestAnimationFrame(() => mapInstance.invalidateSize(false)));
            if ('ResizeObserver' in window && mapElement) {
                new ResizeObserver(() => mapInstance.invalidateSize(false)).observe(mapElement);
            }

            // Bind Event Listeners for Filters
            document.getElementById('filterBarangay').addEventListener('change', applyFilters);
            document.getElementById('filterMinPrice').addEventListener('input', applyFilters);
            document.getElementById('filterMaxPrice').addEventListener('input', applyFilters);
            document.getElementById('filterType').addEventListener('change', applyFilters);
            document.querySelectorAll('.amenity-filter').forEach(cb => cb.addEventListener('change', applyFilters));
            
            document.getElementById('btnClearFilters').addEventListener('click', clearFilters);
            
            if (document.getElementById('btnCompareGo')) {
                document.getElementById('btnCompareGo').addEventListener('click', goCompare);
            }

            // Event delegation for compare checkboxes (bypasses CSP)
            document.getElementById('propertiesGrid').addEventListener('change', (e) => {
                const cb = e.target.closest('.compare-cb');
                if (cb) {
                    const id = cb.value;
                    toggleCompare(cb, id);
                }
            });

            // Initial Fetch
            fetchProperties();
        });

        // Fetch properties with 4 Input Criteria passed to the Ranked Recommendation Engine
        async function fetchProperties() {
            propertyRequestController?.abort();
            propertyRequestController = new AbortController();
            try {
                const barangay = document.getElementById('filterBarangay')?.value || '';
                const minPrice = document.getElementById('filterMinPrice')?.value || '';
                const maxPrice = document.getElementById('filterMaxPrice')?.value || '';
                const type = document.getElementById('filterType')?.value || '';

                const activeAmenities = [];
                document.querySelectorAll('.amenity-filter:checked').forEach(cb => {
                    activeAmenities.push(cb.value);
                });

                let queryParams = `preferred_location=${encodeURIComponent(barangay)}&min_price=${encodeURIComponent(minPrice)}&max_price=${encodeURIComponent(maxPrice)}&preferred_property_type=${encodeURIComponent(type)}`;
                activeAmenities.forEach(a => {
                    queryParams += `&amenities=${encodeURIComponent(a)}`;
                });

                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch(`/api/properties/recommendations/ranked?${queryParams}`, {
                    headers,
                    signal: propertyRequestController.signal
                });

                if (!response.ok) {
                    document.getElementById('propertiesGrid').innerHTML = `<p role="alert" style="grid-column: 1/-1; text-align: center; color: var(--error);">Failed to load recommended listings. Please try again.</p>`;
                    return;
                }

                const result = await response.json();
                allProperties = result.data || [];
                renderUI(allProperties);

            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error(err);
                document.getElementById('propertiesGrid').innerHTML = `<p role="alert" style="grid-column: 1/-1; text-align: center; color: var(--error);">Property listings could not be loaded. Please check your connection and try again.</p>`;
            }
        }

        function renderUI(items) {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = '';
            
            // Clear prior markers
            markersGroup.clearLayers();

            if (!items || items.length === 0) {
                grid.innerHTML = `<p role="status" aria-live="polite" style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem 0;">No approved properties match your active filter criteria. Try adjusting or clearing a filter.</p>`;
                return;
            }

            // Check if any filter option is actively set by the user
            const barangay = document.getElementById('filterBarangay')?.value || '';
            const minPrice = document.getElementById('filterMinPrice')?.value || '';
            const maxPrice = document.getElementById('filterMaxPrice')?.value || '';
            const type = document.getElementById('filterType')?.value || '';
            const activeAmenitiesCount = document.querySelectorAll('.amenity-filter:checked').length;

            const hasActiveFilter = Boolean(barangay || minPrice || maxPrice || type || activeAmenitiesCount > 0);

            const markers = [];
            const markerMap = {};

            items.forEach(item => {
                const prop = item.property || item;
                const rank = Number(item.rank) || 1;
                const matchPct = Math.max(0, Math.min(100, Number(item.match_percentage) || 100));
                const out = item.output_criteria || {};
                const propertyId = String(prop.id || '');
                const safePropertyId = encodeURIComponent(propertyId);
                const propertyName = domiknowEscapeHtml(prop.property_name || 'Unnamed property');
                const propertyType = domiknowEscapeHtml(String(prop.property_type || 'Property').replace(/_/g, ' '));
                const barangayName = domiknowEscapeHtml(prop.barangay || 'Location not specified');
                const imageUrl = domiknowSafeExternalUrl(prop.main_image_url || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=400&q=80');
                const propertyRating = Number(out.property_rating ?? prop.average_rating ?? 0);
                const landlordRating = Number(out.landlord_rating ?? 0);
                const trustScore = Math.max(0, Math.min(100, Number(out.trust_score) || 0));
                const reliability = domiknowEscapeHtml(out.rental_reliability || 'Not yet rated');
                
                // Amenities HTML preview
                let amenHtml = '';
                const amenitiesList = prop.amenities || [];
                const preview = amenitiesList.slice(0, 3);
                preview.forEach(a => {
                    amenHtml += `<span class="badge-amenity">${domiknowEscapeHtml(a)}</span>`;
                });
                if (amenitiesList.length > 3) {
                    amenHtml += `<span class="badge-amenity">+${amenitiesList.length - 3}</span>`;
                }

                // Render Match % badge ONLY when user has active filter options
                const matchBadgeHtml = hasActiveFilter ? `
                    <span class="reco-score-badge" style="background: var(--color-action-primary);">
                        ${matchPct}% Match
                    </span>
                ` : '';

                const card = document.createElement('div');
                card.className = 'prop-card';
                card.dataset.propId = propertyId;
                
                card.innerHTML = `
                    <div class="prop-img-wrapper" style="position: relative;">
                        <img src="${imageUrl}" alt="${propertyName}" class="prop-img" loading="lazy" decoding="async">
                        <span style="position: absolute; top: 10px; left: 10px; background: ${rank === 1 ? 'var(--color-action-primary)' : 'var(--brand-navy)'}; color: white; padding: 0.2rem 0.65rem; border-radius: var(--radius-sm); font-weight: 800; font-size: 0.72rem; box-shadow: var(--shadow-card); display: inline-flex; align-items: center; gap: 0.25rem;">
                            ${rank === 1 ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg> Rank #1 Top Match` : `Rank #${rank}`}
                        </span>
                        ${matchBadgeHtml}
                    </div>

                    <div class="prop-content">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                            <span style="font-size: 0.725rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em;">
                                ${propertyType}
                            </span>
                        </div>

                        <h4 class="prop-title" style="margin: 0.25rem 0;">${propertyName}</h4>
                        
                        <!-- 5 Output Criteria Badges Display Grid -->
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem; margin: 0.65rem 0; background: var(--bg-primary); padding: 0.6rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">1. Location</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Brgy. ${barangayName}</div>
                            </div>
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">2. Property Rating</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #f59e0b; display: inline-flex; align-items: center; gap: 0.2rem;">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
                                    ${Number.isFinite(propertyRating) ? propertyRating.toFixed(1) : '0.0'} / 5.0
                                </div>
                            </div>
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">3. Trust Score</span>
                                    <div style="font-size: 0.78rem; font-weight: 700; color: var(--color-success-text); display: inline-flex; align-items: center; gap: 0.2rem;">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                    ${trustScore} / 100
                                </div>
                            </div>
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">4. Reliability</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #0284c7; display: inline-flex; align-items: center; gap: 0.2rem;">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                    ${reliability}
                                </div>
                            </div>
                            <div style="grid-column: span 2;">
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">5. Landlord Rating</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #8b5cf6; display: inline-flex; align-items: center; gap: 0.2rem;">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    ${Number.isFinite(landlordRating) ? landlordRating.toFixed(1) : '0.0'} / 5.0
                                </div>
                            </div>
                        </div>

                        <div class="prop-amenities-preview" style="margin-bottom: 0.75rem;">${amenHtml}</div>

                        <div style="display: flex; align-items: center; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 0.75rem; margin-top: 0.5rem;">
                            <a href="property-details.html?id=${safePropertyId}" class="btn-prop-detail" style="width: 100%; text-align: center; padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: 700; border-radius: var(--radius-md); text-decoration: none;">View Details &amp; Reserve</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);

                // Add Custom Animated Leaflet Marker
                const lat = Number(prop.latitude);
                const lng = Number(prop.longitude);
                if (Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {

                    const markerIcon = L.divIcon({
                        className: '',
                        html: rank === 1
                            ? `<div class="map-top1-pulse" style="background: var(--color-action-primary); color: white; border: 2.5px solid white; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; box-shadow: var(--shadow-dropdown);">#1</div>`
                            : `<div class="marker-inner" style="background: var(--brand-navy); color: white; border: 2px solid white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.75rem; box-shadow: var(--shadow-card);">#${rank}</div>`,
                        iconSize: rank === 1 ? [38, 38] : [30, 30],
                        iconAnchor: rank === 1 ? [19, 19] : [15, 15]
                    });

                    const marker = L.marker([lat, lng], { icon: markerIcon })
                        .bindPopup(`
                            <div style="font-family: var(--font-family); padding: 0.35rem 0.25rem;">
                                <span style="background: ${rank === 1 ? 'var(--color-action-primary)' : 'var(--brand-navy)'}; color: white; padding: 0.2rem 0.6rem; border-radius: var(--radius-sm); font-weight: 800; font-size: 0.72rem;">${rank === 1 ? 'Top Match' : `Rank #${rank}`} (${matchPct}% Match)</span>
                                <h4 style="margin: 0.4rem 0 0.25rem 0; font-weight: 800; color: var(--primary); font-size: 0.95rem;">${propertyName}</h4>
                                <p style="margin: 0.2rem 0 0.5rem 0; font-size: 0.78rem; color: #059669; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                    Trust Score: ${trustScore}/100
                                </p>
                                <a href="property-details.html?id=${safePropertyId}" style="font-size: 0.78rem; font-weight: 800; text-decoration: none; color: white; background: var(--color-action-primary); padding: 0.35rem 0.75rem; border-radius: var(--radius-sm); display: inline-block;">Open Details</a>
                            </div>
                        `);
                    
                    markersGroup.addLayer(marker);
                    markers.push(marker);
                    markerMap[propertyId] = { marker, lat, lng };
                }

                // Card Hover & Click Interactive Map Animations
                card.addEventListener('mouseenter', () => {
                    const data = markerMap[propertyId];
                    if (data && data.marker) {
                        const iconElement = data.marker.getElement();
                        if (iconElement) {
                            const innerDiv = iconElement.querySelector('div');
                            if (innerDiv) innerDiv.classList.add('map-marker-bounce');
                        }
                    }
                });

                card.addEventListener('mouseleave', () => {
                    const data = markerMap[propertyId];
                    if (data && data.marker) {
                        const iconElement = data.marker.getElement();
                        if (iconElement) {
                            const innerDiv = iconElement.querySelector('div');
                            if (innerDiv) innerDiv.classList.remove('map-marker-bounce');
                        }
                    }
                });

                card.addEventListener('click', (e) => {
                    // Avoid triggering when clicking View Details link
                    if (e.target.closest('a')) return;
                    const data = markerMap[propertyId];
                    if (data && data.marker) {
                        mapInstance.flyTo([data.lat, data.lng], 16, {
                            animate: true,
                            duration: 1.2,
                            easeLinearity: 0.25
                        });
                        data.marker.openPopup();
                    }
                });
            });

            // Smooth animated camera transition to fit all property markers
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                mapInstance.flyToBounds(group.getBounds().pad(0.15), {
                    animate: true,
                    duration: 1.4,
                    easeLinearity: 0.25
                });
            }
        }

        // Apply filters dynamically by re-querying the recommendation API with active Filter Options
        function applyFilters() {
            clearTimeout(filterRequestTimer);
            filterRequestTimer = setTimeout(fetchProperties, 350);
        }

        function clearFilters() {
            clearTimeout(filterRequestTimer);
            document.getElementById('filterBarangay').value = '';
            document.getElementById('filterMinPrice').value = '';
            document.getElementById('filterMaxPrice').value = '';
            document.getElementById('filterType').value = '';
            document.querySelectorAll('.amenity-filter').forEach(cb => cb.checked = false);
            
            fetchProperties();
        }

        // Comparison Handler
        function toggleCompare(cb, id) {
            if (cb.checked) {
                if (selectedPropertyIds.length >= 4) {
                    cb.checked = false;
                    alert('You can compare maximum 4 properties.');
                    return;
                }
                selectedPropertyIds.push(id);
            } else {
                selectedPropertyIds = selectedPropertyIds.filter(pid => pid !== id);
            }

            updateCompareBar();
        }

        function updateCompareBar() {
            const bar = document.getElementById('compareBar');
            const count = document.getElementById('compareCount');
            
            count.textContent = selectedPropertyIds.length;

            if (selectedPropertyIds.length >= 2) {
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function goCompare() {
            if (selectedPropertyIds.length < 2) return;
            const query = selectedPropertyIds.map(id => `id=${id}`).join('&');
            window.location.href = `compare.html?${query}`;
        }


    </script>
</body>
</html>
