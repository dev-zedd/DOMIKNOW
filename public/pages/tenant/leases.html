<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lease Agreement - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <style>
        .lease-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        .lease-card { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
        .lease-header { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--tenant, #6366f1) 0%, #4f46e5 100%); color: white; }
        .lease-header.pending  { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .lease-header.rejected { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .lease-header.active   { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .lease-body { padding: 2rem; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
        .detail-item { display: flex; flex-direction: column; }
        .detail-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.2rem; }
        .detail-value { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .notice-banner { background-color: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius-lg); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

        .action-btn { padding: 0.5rem 1.25rem; font-size: 0.875rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; border: 1px solid transparent; transition: all 0.2s ease; }
        .btn-view   { background-color: #6366f1; color: white; }
        .btn-view:hover { background-color: #4f46e5; }
        .btn-review { background-color: #f59e0b; color: white; }
        .btn-review:hover { background-color: #d97706; }
        .btn-accept { background-color: #10b981; color: white; }
        .btn-accept:hover { background-color: #059669; }
        .btn-reject { background-color: #ef4444; color: white; }
        .btn-reject:hover { background-color: #dc2626; }
        .btn-close  { background-color: #6b7280; color: white; }
        .btn-close:hover { background-color: #4b5563; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background-color: rgba(15,23,42,0.65); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 1.5rem; }
        .modal-container { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 860px; max-height: 92vh; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
        .modal-header { padding: 1.25rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-primary); flex-shrink: 0; }
        .modal-body { padding: 2rem; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 1rem 2rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-primary); flex-shrink: 0; gap: 1rem; flex-wrap: wrap; }
        .modal-close-btn { background: transparent; border: none; font-size: 1.6rem; cursor: pointer; color: var(--text-secondary); line-height: 1; padding: 0.25rem 0.5rem; border-radius: 4px; }
        .modal-close-btn:hover { background-color: var(--border-color); }

        .contract-section { margin-bottom: 2rem; }
        .contract-section-title { font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); padding-bottom: 0.4rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .contract-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 1.15rem; }
        .contract-item { display: flex; flex-direction: column; }
        .contract-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
        .contract-value { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); }
        .contract-textarea { background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem 1rem; font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; }
        .parties-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        .party-box { background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem 1.25rem; }
        .party-role { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.35rem; }
        .party-name { font-size: 1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.4rem; }
        .party-detail { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.7; }
        .signature-sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; padding: 1.5rem; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        .signature-box { text-align: center; border-top: 1px dashed var(--border-color); padding-top: 1rem; margin-top: 1.5rem; }
        .signature-name { font-family: 'Brush Script MT', cursive; font-size: 1.8rem; color: var(--color-link); }
        .sig-date { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.25rem; }
        .sig-input { width: 100%; padding: 0.6rem 0.9rem; border: 2px solid #10b981; border-radius: var(--radius-sm); font-size: 0.9rem; background-color: var(--bg-secondary); color: var(--text-primary); margin-top: 0.4rem; }
        .sig-input:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
    </style>
    <link href="../../css/design-system.css?v=20260905-1" rel="stylesheet">
    <script src="../../js/ui.js?v=20260827-3" defer></script>
</head>
<body class="app-loading" data-role="tenant" data-page-title="Lease Agreement">
    <nav class="navbar navbar-tenant">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration:none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-tenant">Tenant</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="properties.html" class="navbar-menu-link">Property Discovery</a>
                <a href="properties.html" class="navbar-menu-link">Discovery</a>
                <a href="applications.html" class="navbar-menu-link">My Applications</a>
                <a href="leases.html" class="navbar-menu-link active">My Lease</a>
                <a href="billings.html" class="navbar-menu-link">My Billings</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">

        <div id="leasesContainer" class="lease-grid">
            <div style="text-align:center;padding:3rem;color:var(--text-muted);background:var(--bg-secondary);border-radius:var(--radius-lg);border:1px solid var(--border-color);">
                Loading your lease agreement...
            </div>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js?v=20260905-1"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            loadLeases();
        });

        async function loadLeases() {
            const container = document.getElementById('leasesContainer');
            try {
                const res = await fetch('/api/leases/my', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) {
                    container.innerHTML = `<div style="text-align:center;padding:3rem;color: var(--color-error-text);background:var(--bg-secondary);border-radius:var(--radius-lg);">Failed to load lease. (${res.status})</div>`;
                    return;
                }
                const { data: leases } = await res.json();

                if (!leases || leases.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:4rem 2rem;color:var(--text-muted);background:var(--bg-secondary);border-radius:var(--radius-lg);border:1px solid var(--border-color);">
                            <h3 style="margin-bottom:0.5rem;">No Lease Contract Found</h3>
                            <p style="color:var(--text-secondary);margin-bottom:1.5rem;">Your lease will appear here once your application is approved and drafted by the landlord.</p>
                            <a href="applications.html" class="btn-primary" style="text-decoration:none;padding:0.6rem 1.5rem;display:inline-block;width:auto;background-color:#6366f1;">Check Application Status</a>
                        </div>`;
                    return;
                }

                container.innerHTML = '';

                leases.forEach(lease => {
                    const status = lease.lease_status;
                    const propName  = lease.properties?.property_name || '—';
                    const propAddr  = buildAddress(lease.properties);
                    const start     = fmtDate(lease.lease_start_date);
                    const end       = fmtDate(lease.lease_end_date);
                    const rent      = fmtMoney(lease.monthly_rent);
                    const deposit   = fmtMoney(lease.security_deposit);

                    let targetUnitText = '';
                    if (lease.property_units) {
                        targetUnitText = `Room ${lease.property_units.unit_number}`;
                        if (lease.unit_beds) {
                            targetUnitText += ` - ${lease.unit_beds.bed_label}`;
                        }
                    }

                    let statusClass = 'status-pending';
                    let statusLabel = status.replace(/_/g,' ').toUpperCase();
                    let isPending   = false;

                    if (status === 'active') {
                        statusClass = 'status-active'; statusLabel = 'ACTIVE';
                    } else if (status === 'pending_tenant_acceptance') {
                        statusClass = 'status-pending'; statusLabel = 'AWAITING YOUR SIGNATURE'; isPending = true;
                        // Warning banner
                        const banner = document.createElement('div');
                        banner.className = 'notice-banner';
                        banner.style.marginBottom = '1rem';
                        banner.innerHTML = `
                            <div>
                                <strong style="color: var(--color-warning-text);">Action Required</strong>
                                <div style="font-size:0.875rem;color:var(--text-secondary);margin-top:0.2rem;">The landlord drafted a lease for <strong>${domiknowEscapeHtml(propName)}</strong>. Please review and sign it.</div>
                            </div>
                            <a href="lease-details.html?id=${encodeURIComponent(lease.id || '')}" class="action-btn btn-review" style="text-decoration:none;display:inline-flex;align-items:center;">Sign Agreement</a>
                        `;
                        container.appendChild(banner);
                    } else if (status === 'rejected') {
                        statusClass = 'status-rejected'; statusLabel = 'REJECTED';
                    } else {
                        statusClass = 'status-rejected';
                    }

                    const card = document.createElement('div');
                    card.className = 'tenant-lease-card';

                    let actionBtnHtml = '';
                    if (status === 'pending_tenant_acceptance') {
                        actionBtnHtml = `
                            <a href="lease-details.html?id=${encodeURIComponent(lease.id || '')}" class="tenant-lease-btn primary" style="text-decoration:none;">
                                <span>Review & Sign Agreement</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </a>`;
                    } else {
                        actionBtnHtml = `
                            <a href="lease-details.html?id=${encodeURIComponent(lease.id || '')}" class="tenant-lease-btn" style="text-decoration:none;">
                                <span>View Lease Agreement</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </a>`;
                    }

                    card.innerHTML = `
                        <div class="tenant-lease-card-header">
                            <div class="tenant-lease-title-group">
                                <h2 class="tenant-lease-number">Lease: ${domiknowEscapeHtml(lease.lease_number || 'DRAFT')}</h2>
                                <div class="tenant-lease-property">${domiknowEscapeHtml(propName)}</div>
                            </div>
                            <span class="tenant-lease-status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="tenant-lease-divider"></div>
                        <div class="tenant-lease-details-grid">
                            <div class="tenant-lease-detail-item">
                                <div class="tenant-lease-label">Property Address</div>
                                <div class="tenant-lease-val">${domiknowEscapeHtml(propAddr)}</div>
                            </div>
                            <div class="tenant-lease-detail-item">
                                <div class="tenant-lease-label">Assigned Space</div>
                                <div class="tenant-lease-val space-val">${domiknowEscapeHtml(targetUnitText || 'Entire Property')}</div>
                            </div>
                            <div class="tenant-lease-detail-item">
                                <div class="tenant-lease-label">Tenancy Duration</div>
                                <div class="tenant-lease-val">${start} to ${end}</div>
                            </div>
                            <div class="tenant-lease-detail-item">
                                <div class="tenant-lease-label">Monthly Rent</div>
                                <div class="tenant-lease-val rent-val">₱${rent} PHP</div>
                            </div>
                            <div class="tenant-lease-detail-item">
                                <div class="tenant-lease-label">Security Deposit</div>
                                <div class="tenant-lease-val deposit-val">₱${deposit} PHP</div>
                            </div>
                        </div>
                        <div class="tenant-lease-divider"></div>
                        <div class="tenant-lease-actions">
                            ${actionBtnHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error('loadLeases error:', err);
                container.innerHTML = `<div style="text-align:center;padding:3rem;color: var(--color-error-text);background:var(--bg-secondary);border-radius:var(--radius-lg);">Connection error loading leases.</div>`;
            }
        }

        // ── Utility helpers ─────────────────────────────────────────────────
        function fmtMoney(v) {
            return parseFloat(v || 0).toLocaleString('en-PH', { minimumFractionDigits: 2 });
        }
        function fmtDate(d) {
            if (!d) return '—';
            return new Date(d + 'T00:00:00').toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
        }
        function fmtDateLong(d) {
            if (!d) return '—';
            const dt = d.includes('T') ? new Date(d) : new Date(d + 'T00:00:00');
            return dt.toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric' });
        }
        function fmtDateTimeLocal(d) {
            if (!d) return '—';
            return new Date(d).toLocaleString('en-PH');
        }
        function monthDiff(start, end) {
            if (!start || !end) return '?';
            const s = new Date(start + 'T00:00:00'), e = new Date(end + 'T00:00:00');
            return (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth());
        }
        function buildAddress(prop) {
            if (!prop) return '—';
            const parts = [prop.address, prop.barangay ? `Brgy. ${prop.barangay}` : null, prop.municipality, prop.province].filter(Boolean);
            return parts.join(', ') || '—';
        }
    </script>
</body>
</html>
