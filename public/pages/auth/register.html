<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <link href="../../css/design-system.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0355F3;
            --primary-hover: #0247D1;
            --primary-light: #EAF0FF;
            --border-focus: #7EA2FF;
            --bg-primary: #F8FAFC;
            --accent: #0355F3;
            --card-shadow: 0 20px 40px rgba(15, 73, 83, 0.08);
        }

        body {
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--primary);
        }

        .auth-page {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 207, 210, 0.4) 0px, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(249, 142, 110, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        .back-to-home-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .back-to-home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(15, 73, 83, 0.08);
            box-shadow: 0 2px 8px rgba(15, 73, 83, 0.02);
        }

        .back-to-home-link:hover {
            transform: translateX(-4px);
            color: var(--accent);
            border-color: var(--accent);
        }

        .back-to-home-link svg {
            stroke-width: 2.5px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            font-family: inherit;
            color: var(--primary);
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            font-size: 0.9375rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: var(--primary);
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(15, 73, 83, 0.06);
        }

        .form-label {
            font-weight: 700;
            font-size: 0.8125rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input, .form-select, .form-textarea {
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            background-color: white;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 73, 83, 0.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 0.9375rem;
            padding: 0.875rem;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 73, 83, 0.15);
        }
        
        .form-help {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            display: block;
        }
    </style>
    <link href="../../css/design-system.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>
<body class="auth-page">
    <div class="back-to-home-container">
        <a href="../../index.html" class="back-to-home-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back to Home</span>
        </a>
    </div>

    <div class="auth-header">
        <div class="auth-logo">
            <a href="../../index.html" class="brand-lockup" aria-label="DOMIKNOW home">
                <span class="brand-mark" aria-hidden="true">
                    <span class="brand-mark-dot brand-mark-dot-primary"></span>
                    <span class="brand-mark-dot brand-mark-dot-left"></span>
                    <span class="brand-mark-dot brand-mark-dot-right"></span>
                </span>
                <span class="brand-wordmark"><span class="brand-wordmark-domi">DOMI</span><span class="brand-wordmark-know">KNOW</span></span>
            </a>
        </div>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">
            Choose your role and enter your details to get started. Already registered?
            <a href="login.html" class="auth-link">Sign in</a>
        </p>
    </div>

    <div class="auth-card">
        <div id="errorMessage" class="alert alert-danger hidden" style="border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; background: #fef2f2; border: 1px solid #fecaca; padding: 1rem; color: #b91c1c;">
            <span class="alert-icon" style="color: #ef4444; display: inline-flex; align-items: center; flex-shrink: 0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </span>
            <span class="alert-text" style="font-size: 0.875rem; font-weight: 600;">Error message</span>
        </div>

        <div id="successMessage" class="alert alert-success hidden" style="border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 1rem; color: #065f46;">
            <span class="alert-icon" style="color: #10b981; display: inline-flex; align-items: center; flex-shrink: 0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span class="alert-text" style="font-size: 0.875rem; font-weight: 600;">Success message</span>
        </div>

        <form id="registerForm" novalidate style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name *</label>
                <input id="full_name" name="full_name" type="text" required 
                       placeholder="John Doe" class="form-input"
                       minlength="2" maxlength="255">
                <small class="form-error" id="full_name_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input id="email" name="email" type="email" required 
                       placeholder="john@example.com" class="form-input">
                <small class="form-error" id="email_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <div style="position: relative;">
                    <input id="password" name="password" type="password" required 
                           placeholder="••••••••" class="form-input"
                           minlength="8">
                    <button type="button" id="togglePassword" 
                            style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); 
                                   background: none; border: none; cursor: pointer; font-size: 0.8125rem; 
                                   color: var(--primary); font-weight: 700;">
                        Show
                    </button>
                </div>
                <small class="form-help">Must be at least 8 characters with uppercase, lowercase, and number</small>
                <small class="form-error" id="password_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                <div id="passwordStrength" style="margin-top: 0.5rem;"></div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password *</label>
                <input id="confirm_password" name="confirm_password" type="password" required 
                       placeholder="••••••••" class="form-input">
                <small class="form-error" id="confirm_password_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
            </div>

            <div class="form-group">
                <label for="role" class="form-label">I am a...</label>
                <select id="role" name="role" required class="form-select">
                    <option value="tenant">Tenant</option>
                    <option value="landlord">Landlord</option>
                    <option value="maintenance">Maintenance Personnel</option>
                </select>
            </div>

            <div class="form-group">
                <label for="contact_number" class="form-label">Contact Number (Optional)</label>
                <input id="contact_number" name="contact_number" type="tel" placeholder="+63 900 000 0000" class="form-input">
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Address (Optional)</label>
                <textarea id="address" name="address" rows="2" placeholder="Your street address" class="form-textarea"></textarea>
            </div>

            <div class="form-group" style="margin-top: 0.5rem;">
                <button type="submit" id="submitBtn" class="btn-primary">
                    Register
                </button>
            </div>
        </form>
    </div>

    <script src="../../js/auth.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        
        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            confirmPasswordInput.type = type;
            this.textContent = type === 'password' ? 'Show' : 'Hide';
        });
        
        // Password strength indicator
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (!password) {
                strengthDiv.innerHTML = '';
                return;
            }
            
            let strength = 0;
            let feedback = [];
            
            if (password.length >= 8) strength++;
            else feedback.push('at least 8 characters');
            
            if (/[a-z]/.test(password)) strength++;
            else feedback.push('lowercase letter');
            
            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('uppercase letter');
            
            if (/\d/.test(password)) strength++;
            else feedback.push('number');
            
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const colors = ['#ef4444', '#f59e0b', '#eab308', '#84cc16', '#10b981'];
            const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
            
            strengthDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 100px; height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden;">
                        <div style="width: ${strength * 20}%; height: 100%; background: ${colors[strength - 1] || colors[0]}; transition: all 0.3s;"></div>
                    </div>
                    <span style="font-size: 0.75rem; color: ${colors[strength - 1] || colors[0]}; font-weight: 600;">
                        ${labels[strength - 1] || labels[0]}
                    </span>
                </div>
                ${feedback.length > 0 ? `<small style="color: var(--text-secondary); font-size: 0.725rem; display: block; margin-top: 0.25rem;">Need: ${feedback.join(', ')}</small>` : ''}
            `;
        });
        
        // Client-side validation
        function validateForm() {
            let isValid = true;
            
            // Clear previous errors
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input, .form-select, .form-textarea').forEach(el => {
                el.style.borderColor = '';
            });
            
            // Full name validation
            const fullName = document.getElementById('full_name').value.trim();
            if (!fullName) {
                showFieldError('full_name', 'Full name is required');
                isValid = false;
            } else if (fullName.length < 2) {
                showFieldError('full_name', 'Full name must be at least 2 characters');
                isValid = false;
            } else if (fullName.length > 255) {
                showFieldError('full_name', 'Full name is too long');
                isValid = false;
            }
            
            // Email validation
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                showFieldError('email', 'Email is required');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                showFieldError('email', 'Please enter a valid email address');
                isValid = false;
            }
            
            // Password validation
            const password = document.getElementById('password').value;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!password) {
                showFieldError('password', 'Password is required');
                isValid = false;
            } else if (!passwordRegex.test(password)) {
                showFieldError('password', 'Password must be at least 8 characters with uppercase, lowercase, and number');
                isValid = false;
            }
            
            // Confirm password validation
            const confirmPassword = document.getElementById('confirm_password').value;
            if (!confirmPassword) {
                showFieldError('confirm_password', 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                showFieldError('confirm_password', 'Passwords do not match');
                isValid = false;
            }
            
            return isValid;
        }
        
        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById(`${fieldId}_error`);
            const inputEl = document.getElementById(fieldId);
            if (errorEl) errorEl.textContent = message;
            if (inputEl) inputEl.style.borderColor = '#ef4444';
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate form
            if (!validateForm()) {
                return;
            }
            
            // Call existing handleRegister function
            await handleRegister(e);
        });
    </script>
</body>
</html>
