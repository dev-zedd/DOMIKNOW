<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <link href="../../css/design-system.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>
<body class="app-loading" data-role="admin" data-page-title="Audit Trail">
    <nav class="navbar navbar-admin">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="overview.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-admin">Admin</span>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-container audit-page">
        <section class="audit-filter-panel" aria-labelledby="auditFilterTitle">
            <div class="audit-panel-heading">
                <div>
                    <p class="audit-panel-eyebrow">Search records</p>
                    <h2 id="auditFilterTitle">Filter audit activity</h2>
                </div>
                <button type="button" id="resetFiltersBtn" class="audit-reset-button">Reset filters</button>
            </div>

            <form id="auditFilterForm" class="audit-filter-form">
                <div class="form-group">
                    <label class="form-label" for="filterRole">Actor role</label>
                    <select id="filterRole" class="form-input">
                        <option value="">All roles</option>
                        <option value="tenant">Tenant</option>
                        <option value="landlord">Landlord</option>
                        <option value="maintenance">Maintenance personnel</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <div class="form-group audit-action-field">
                    <label class="form-label" for="filterAction">Action contains</label>
                    <input type="search" id="filterAction" class="form-input" placeholder="Example: LOGIN or PROPERTY" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label" for="filterDateFrom">From date</label>
                    <input type="date" id="filterDateFrom" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="filterDateTo">To date</label>
                    <input type="date" id="filterDateTo" class="form-input">
                </div>
                <button id="filterBtn" type="submit" class="btn-primary audit-apply-button">
                    <span>Apply filters</span>
                </button>
            </form>

            <div id="auditFilterFeedback" class="audit-filter-feedback" role="status" aria-live="polite">
                Showing the latest activity across all roles and actions.
            </div>
        </section>

        <section class="audit-list-panel" aria-labelledby="auditRecordsTitle">
            <div class="audit-list-heading">
                <div>
                    <p class="audit-panel-eyebrow">Immutable activity record</p>
                    <h2 id="auditRecordsTitle">System events</h2>
                </div>
                <span id="auditResultCount" class="audit-result-count">Loading records</span>
            </div>

            <div class="audit-table-scroll">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th scope="col">Actor</th>
                            <th scope="col">Role</th>
                            <th scope="col">Action</th>
                            <th scope="col">Details</th>
                            <th scope="col">Date and time</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody" aria-live="polite" aria-busy="true">
                        <tr class="audit-state-row">
                            <td colspan="5" role="status">Loading audit records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');
        const filterForm = document.getElementById('auditFilterForm');
        const resetFiltersBtn = document.getElementById('resetFiltersBtn');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            syncDateLimits();
            fetchAuditTrails();
            filterForm.addEventListener('submit', event => {
                event.preventDefault();
                fetchAuditTrails();
            });
            resetFiltersBtn.addEventListener('click', () => {
                filterForm.reset();
                syncDateLimits();
                fetchAuditTrails();
            });
            document.getElementById('filterDateFrom').addEventListener('change', syncDateLimits);
            document.getElementById('filterDateTo').addEventListener('change', syncDateLimits);
        });

        function syncDateLimits() {
            const fromInput = document.getElementById('filterDateFrom');
            const toInput = document.getElementById('filterDateTo');
            toInput.min = fromInput.value || '';
            fromInput.max = toInput.value || '';
        }

        function getFilters() {
            return {
                role: document.getElementById('filterRole').value,
                action: document.getElementById('filterAction').value.trim(),
                from: document.getElementById('filterDateFrom').value,
                to: document.getElementById('filterDateTo').value
            };
        }

        function describeFilters(filters) {
            const applied = [];
            if (filters.role) applied.push(`${formatLabel(filters.role)} actors`);
            if (filters.action) applied.push(`actions containing "${filters.action}"`);
            if (filters.from) applied.push(`from ${formatDate(filters.from)}`);
            if (filters.to) applied.push(`through ${formatDate(filters.to)}`);
            return applied.length
                ? `Filtered by ${applied.join(', ')}.`
                : 'Showing the latest activity across all roles and actions.';
        }

        async function fetchAuditTrails() {
            const tableBody = document.getElementById('logsTableBody');
            const resultCount = document.getElementById('auditResultCount');
            const feedback = document.getElementById('auditFilterFeedback');
            const submitButton = document.getElementById('filterBtn');
            const filters = getFilters();

            if (filters.from && filters.to && filters.from > filters.to) {
                feedback.textContent = 'The start date must be earlier than or equal to the end date.';
                feedback.dataset.state = 'error';
                document.getElementById('filterDateFrom').focus();
                return;
            }

            const params = new URLSearchParams();
            if (filters.role) params.append('user_role', filters.role);
            if (filters.action) params.append('action', filters.action);
            if (filters.from) params.append('date_from', filters.from);
            if (filters.to) params.append('date_to', filters.to);

            tableBody.setAttribute('aria-busy', 'true');
            tableBody.replaceChildren(createStateRow('Loading matching audit records...', 'status'));
            resultCount.textContent = 'Loading records';
            submitButton.disabled = true;
            submitButton.querySelector('span').textContent = 'Applying...';
            feedback.dataset.state = '';

            try {
                const response = await fetch(`/api/admin/audit-logs?${params.toString()}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(`Audit service returned ${response.status}`);

                const result = await response.json();
                const logs = Array.isArray(result.data) ? result.data : [];
                tableBody.replaceChildren();

                if (!logs.length) {
                    tableBody.appendChild(createStateRow('No audit records match these filters. Try broadening the role, action, or date range.', 'status'));
                    resultCount.textContent = '0 records';
                } else {
                    logs.forEach(log => tableBody.appendChild(createAuditRow(log)));
                    resultCount.textContent = `${logs.length} ${logs.length === 1 ? 'record' : 'records'}`;
                }

                feedback.textContent = describeFilters(filters);
                feedback.dataset.state = 'success';
            } catch (error) {
                console.error('Audit trail load error:', error);
                tableBody.replaceChildren(createStateRow('The audit service could not be reached. Check your connection and try again.', 'alert'));
                resultCount.textContent = 'Unavailable';
                feedback.textContent = 'Audit records were not updated.';
                feedback.dataset.state = 'error';
            } finally {
                tableBody.setAttribute('aria-busy', 'false');
                submitButton.disabled = false;
                submitButton.querySelector('span').textContent = 'Apply filters';
            }
        }

        function createAuditRow(log) {
            const row = document.createElement('tr');
            const actorCell = createCell('Actor');
            const actorName = document.createElement('strong');
            actorName.className = 'audit-actor-name';
            actorName.textContent = log.users?.full_name || 'Unknown actor';
            actorCell.appendChild(actorName);

            const roleCell = createCell('Role');
            const role = log.users?.role || 'unknown';
            const roleBadge = document.createElement('span');
            roleBadge.className = `audit-role-badge audit-role-badge--${role}`;
            roleBadge.textContent = formatLabel(role);
            roleCell.appendChild(roleBadge);

            const actionCell = createCell('Action');
            const actionCode = document.createElement('code');
            actionCode.className = 'audit-action-code';
            actionCode.textContent = log.action || 'UNSPECIFIED_ACTION';
            actionCell.appendChild(actionCode);

            const descriptionCell = createCell('Details');
            descriptionCell.classList.add('audit-description-cell');
            descriptionCell.textContent = log.description || 'No description provided.';

            const timestampCell = createCell('Date and time');
            const timestamp = new Date(log.created_at);
            const timeElement = document.createElement('time');
            timeElement.className = 'audit-timestamp';
            if (!Number.isNaN(timestamp.getTime())) {
                timeElement.dateTime = timestamp.toISOString();
                timeElement.textContent = timestamp.toLocaleString(undefined, {
                    year: 'numeric', month: 'short', day: 'numeric',
                    hour: 'numeric', minute: '2-digit'
                });
            } else {
                timeElement.textContent = 'Unknown time';
            }
            timestampCell.appendChild(timeElement);

            row.append(actorCell, roleCell, actionCell, descriptionCell, timestampCell);
            return row;
        }

        function createCell(label) {
            const cell = document.createElement('td');
            cell.dataset.label = label;
            return cell;
        }

        function createStateRow(message, role) {
            const row = document.createElement('tr');
            row.className = 'audit-state-row';
            const cell = document.createElement('td');
            cell.colSpan = 5;
            cell.setAttribute('role', role);
            cell.textContent = message;
            row.appendChild(cell);
            return row;
        }

        function formatLabel(value) {
            return String(value || '').replace(/_/g, ' ').replace(/\b\w/g, character => character.toUpperCase());
        }

        function formatDate(value) {
            const date = new Date(`${value}T00:00:00`);
            return Number.isNaN(date.getTime())
                ? value
                : date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
