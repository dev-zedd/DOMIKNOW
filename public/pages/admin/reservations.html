<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Monitoring - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <style>
        .reservations-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9375rem;
        }
        th {
            font-weight: 700;
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        tr:hover td {
            background-color: var(--bg-primary);
        }
        .action-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn-action-approve {
            background-color: var(--success-bg);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .btn-action-approve:hover {
            background-color: var(--success);
            color: white;
        }
        .btn-action-reject {
            background-color: var(--error-bg);
            color: var(--error);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .btn-action-reject:hover {
            background-color: var(--error);
            color: white;
        }
        .btn-action-cancel {
            background-color: #f1f5f9;
            color: var(--text-secondary);
            border-color: #cbd5e1;
        }
        .btn-action-cancel:hover {
            background-color: var(--text-secondary);
            color: white;
        }
        .nav-back {
            margin-bottom: 1.5rem;
        }
        .nav-back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.875rem;
            transition: color var(--transition-fast);
        }
        .nav-back-link:hover {
            color: var(--primary);
        }
    </style>
    <link href="../../css/design-system.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>
<body class="app-loading" data-role="admin" data-page-title="Reservation Oversight">
    <!-- Navbar -->
    <nav class="navbar navbar-admin">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="overview.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-admin">Admin</span>
            </div>
            <div class="navbar-menu" style="flex-wrap: wrap; gap: 0.5rem 1rem;">
                <a href="users.html" class="navbar-menu-link">Users</a>
                <a href="property-review.html" class="navbar-menu-link">Property Review</a>
                <a href="reservations.html" class="navbar-menu-link active">Reservation Monitoring</a>
                <a href="payments.html" class="navbar-menu-link">Payment Monitor</a>
                <a href="reports.html" class="navbar-menu-link">Reports Triage</a>
                <a href="audit-logs.html" class="navbar-menu-link">Audit Logs</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Reservation Request Monitor</h2>
            <div id="actionFeedback" class="alert alert-success hidden" style="margin-bottom: 0; padding: 0.5rem 1rem;"></div>
        </div>

        <div class="reservations-card">
            <table>
                <thead>
                    <tr>
                        <th>Tenant Details</th>
                        <th>Property Requested</th>
                        <th>Move-In Date</th>
                        <th>Tenant Message</th>
                        <th>Request Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reservationsTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted);">Loading system reservations...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');

        document.addEventListener('DOMContentLoaded', loadAllReservations);

        async function loadAllReservations() {
            if (!token) return;
            const tableBody = document.getElementById('reservationsTableBody');

            try {
                const response = await fetch('/api/reservations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--error);">Failed to load reservations directory. Check credentials.</td></tr>`;
                    return;
                }

                const result = await response.json();
                const reservations = result.data || [];

                if (reservations.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">No reservation requests exist in system databases yet.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                reservations.forEach(res => {
                    const row = document.createElement('tr');
                    
                    // Format status class
                    let statusClass = 'status-pending';
                    if (res.status === 'approved') statusClass = 'status-active';
                    if (res.status === 'rejected') statusClass = 'status-rejected';
                    if (res.status === 'cancelled') statusClass = 'status-rejected';

                    // Format dates
                    const moveIn = new Date(res.move_in_date).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });
                    const created = new Date(res.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });

                    const tenantName = res.users ? res.users.full_name : 'Unknown User';
                    const tenantEmail = res.users ? res.users.email : 'N/A';
                    const propName = res.properties ? res.properties.property_name : 'Unknown Property';

                    // Build action buttons
                    let actionsHtml = '';
                    if (res.status === 'pending') {
                        actionsHtml += `<button onclick="updateReservationStatus('${res.id}', 'approved')" class="btn-action btn-action-approve">Approve</button>`;
                        actionsHtml += `<button onclick="updateReservationStatus('${res.id}', 'rejected')" class="btn-action btn-action-reject">Reject</button>`;
                    } else if (res.status === 'approved') {
                        actionsHtml += `<button onclick="updateReservationStatus('${res.id}', 'cancelled')" class="btn-action btn-action-cancel">Cancel Booking</button>`;
                    } else {
                        actionsHtml = `<span style="font-size: 0.75rem; color: var(--text-muted); font-style: italic;">No actions (Closed)</span>`;
                    }

                    row.innerHTML = `
                        <td>
                            <div style="font-weight: 700;">${domiknowEscapeHtml(tenantName)}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem;">✉ ${domiknowEscapeHtml(tenantEmail)}</div>
                        </td>
                        <td style="font-weight: 600; color: var(--primary);">${domiknowEscapeHtml(propName)}</td>
                        <td style="font-weight: 600;">${moveIn}</td>
                        <td style="font-size: 0.8125rem; color: var(--text-secondary); max-width: 200px; line-height: 1.4;">
                            ${res.message ? domiknowEscapeHtml(res.message) : '<span style="color: var(--text-muted); font-style: italic;">No message</span>'}
                        </td>
                        <td>${created}</td>
                        <td><span class="status-badge ${statusClass}">${domiknowEscapeHtml(res.status)}</span></td>
                        <td><div class="action-group">${actionsHtml}</div></td>
                    `;
                    
                    tableBody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--error);">Error contacting booking services.</td></tr>`;
            }
        }

        async function updateReservationStatus(resId, newStatus) {
            const actionLabels = {
                approved: 'approve this reservation request',
                rejected: 'reject this reservation request',
                cancelled: 'cancel this approved booking'
            };
            const requestedAction = actionLabels[newStatus] || `mark this reservation as ${newStatus}`;
            const confirmUpdate = await window.domiknowConfirm({
                variant: ['rejected', 'cancelled'].includes(newStatus) ? 'danger' : 'warning',
                eyebrow: 'Reservation decision',
                title: `${newStatus.charAt(0).toUpperCase() + newStatus.slice(1)} this reservation?`,
                message: `You are about to ${requestedAction}. This changes the reservation workflow for the tenant and landlord.`,
                confirmLabel: newStatus === 'approved' ? 'Approve reservation' : newStatus === 'rejected' ? 'Reject reservation' : 'Confirm change',
                cancelLabel: 'Go back'
            });
            if (!confirmUpdate) return;

            const feedbackEl = document.getElementById('actionFeedback');
            try {
                const response = await fetch(`/api/reservations/${resId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    feedbackEl.textContent = `Reservation successfully ${newStatus}.`;
                    feedbackEl.classList.remove('hidden');
                    setTimeout(() => feedbackEl.classList.add('hidden'), 4000);
                    loadAllReservations();
                } else {
                    const result = await response.json();
                    alert(result.message || 'Failed to update reservation status');
                }
            } catch (err) {
                console.error('Error updating status:', err);
                alert('An error occurred.');
            }
        }
    </script>
</body>
</html>
