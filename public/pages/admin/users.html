<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <link href="../../css/design-system.css" rel="stylesheet">
    <link href="../../css/admin.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>

<body class="app-loading" data-role="admin" data-page-title="User Access">
    <main class="dashboard-container admin-users-page" aria-labelledby="appPageTitle">
        <!-- Status Feedback Notification -->
        <div id="actionFeedback" class="alert alert-success hidden" role="status" aria-live="polite"></div>

        <!-- Users Table Card -->
        <div class="table-card admin-table-card">
            <table class="admin-data-table admin-record-table">
                <thead>
                    <tr>
                        <th style="width: 22%;">User</th>
                        <th style="width: 24%;">Email</th>
                        <th style="width: 11%; text-align: center;">Role</th>
                        <th style="width: 12%; text-align: center;">Verified</th>
                        <th style="width: 12%; text-align: center;">Account Status</th>
                        <th style="width: 11%; text-align: center;">Registered Date</th>
                        <th style="width: 175px; min-width: 175px; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="7">
                            <div class="admin-table-loading">
                                <span>Loading system users…</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');

        document.addEventListener('DOMContentLoaded', loadUsers);

        async function loadUsers() {
            if (!token) return;
            const tableBody = document.getElementById('usersTableBody');

            try {
                const response = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--color-error-text); padding: 32px 16px;">Failed to load users. Check permissions.</td></tr>`;
                    return;
                }

                const result = await response.json();
                const users = result.data || [];

                if (users.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--color-text-muted); padding: 36px 16px;">No users found in system database.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                users.forEach(user => {
                    const row = document.createElement('tr');

                    // Format role badge class
                    let roleBadgeClass = 'navbar-badge-tenant';
                    if (user.role === 'landlord') roleBadgeClass = 'navbar-badge-landlord';
                    if (user.role === 'maintenance') roleBadgeClass = 'navbar-badge-maintenance';
                    if (user.role === 'admin') roleBadgeClass = 'navbar-badge-admin';

                    // Format status badge class
                    let statusClass = 'status-pending';
                    if (user.account_status === 'active') statusClass = 'status-active';
                    if (user.account_status === 'disabled') statusClass = 'status-rejected';
                    if (user.account_status === 'rejected') statusClass = 'status-rejected';

                    // Format date
                    const regDate = user.created_at ? new Date(user.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric'
                    }) : '—';

                    // Avatar Initial
                    const displayName = user.full_name || user.email || 'User';
                    const avatarInitial = (displayName.charAt(0) || 'U').toUpperCase();

                    // Build action buttons HTML
                    let actionsHtml = '';
                    if (user.role !== 'admin') {
                        if (user.account_status === 'pending') {
                            actionsHtml += `<button type="button" data-user-id="${user.id}" data-action="active" class="btn-action btn-action-approve"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span>Approve</span></button>`;
                            actionsHtml += `<button type="button" data-user-id="${user.id}" data-action="rejected" class="btn-action btn-action-reject"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Reject</span></button>`;
                        } else if (user.account_status === 'active') {
                            actionsHtml += `<button type="button" data-user-id="${user.id}" data-action="disabled" class="btn-action btn-action-disable"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Disable</span></button>`;
                        } else if (user.account_status === 'disabled' || user.account_status === 'rejected') {
                            actionsHtml += `<button type="button" data-user-id="${user.id}" data-action="active" class="btn-action btn-action-reactivate"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>Reactivate</span></button>`;
                        }
                    } else {
                        actionsHtml = `<span class="admin-badge-protected"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Administrator</span></span>`;
                    }

                    row.innerHTML = `
                        <td>
                            <div class="user-identity-cell">
                                <span class="user-avatar-badge user-avatar-badge--${domiknowEscapeHtml(user.role || 'default')}" aria-hidden="true">${avatarInitial}</span>
                                <strong class="user-name-text">${domiknowEscapeHtml(user.full_name || 'Unnamed')}</strong>
                            </div>
                        </td>
                        <td><span class="user-email-text">${domiknowEscapeHtml(user.email)}</span></td>
                        <td style="text-align: center;"><span class="navbar-badge ${roleBadgeClass}">${domiknowEscapeHtml(user.role)}</span></td>
                        <td style="text-align: center;">
                            <span class="verify-chip verify-chip--${user.is_verified ? 'yes' : 'no'}">
                                ${user.is_verified 
                                    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> Verified' 
                                    : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Unverified'}
                            </span>
                        </td>
                        <td style="text-align: center;"><span class="status-badge ${statusClass}">${domiknowEscapeHtml(user.account_status)}</span></td>
                        <td style="text-align: center;"><span class="user-date-text">${regDate}</span></td>
                        <td style="text-align: right;"><div class="action-group" style="justify-content: flex-end;">${actionsHtml}</div></td>
                    `;

                    tableBody.appendChild(row);

                    // Attach event listeners to action buttons
                    const actionButtons = row.querySelectorAll('.btn-action[data-user-id]');
                    actionButtons.forEach(btn => {
                        btn.addEventListener('click', function () {
                            const userId = this.getAttribute('data-user-id');
                            const newStatus = this.getAttribute('data-action');
                            updateStatus(userId, newStatus);
                        });
                    });
                });

            } catch (err) {
                console.error('Error loading directory:', err);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--color-error-text); padding: 32px 16px;">Error contacting registration service.</td></tr>`;
            }
        }

        async function updateStatus(userId, newStatus) {
            const actionLabels = {
                active: 'approve or reactivate this account',
                rejected: 'reject this account request',
                disabled: 'disable this account'
            };
            const requestedAction = actionLabels[newStatus] || `change this account to ${newStatus}`;
            const confirmUpdate = await window.domiknowConfirm({
                variant: ['rejected', 'disabled'].includes(newStatus) ? 'danger' : 'warning',
                eyebrow: 'Account access decision',
                title: `${newStatus.charAt(0).toUpperCase() + newStatus.slice(1)} this account?`,
                message: `You are about to ${requestedAction}. This action is recorded in the administrative history.`,
                confirmLabel: newStatus === 'active' ? 'Activate account' : newStatus === 'disabled' ? 'Disable account' : 'Reject account',
                cancelLabel: 'Keep current status'
            });
            if (!confirmUpdate) return;

            const feedbackEl = document.getElementById('actionFeedback');
            try {
                const response = await fetch(`/api/users/${userId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ account_status: newStatus })
                });

                if (response.ok) {
                    feedbackEl.textContent = `User account successfully updated to ${newStatus}.`;
                    feedbackEl.classList.remove('hidden');
                    setTimeout(() => feedbackEl.classList.add('hidden'), 4000);
                    loadUsers();
                } else {
                    const result = await response.json();
                    alert(result.message || 'Failed to update user status');
                }
            } catch (err) {
                console.error('Error updating status:', err);
                alert('An error occurred while updating status.');
            }
        }
    </script>
</body>

</html>
