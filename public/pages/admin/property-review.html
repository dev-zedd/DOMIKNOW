<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Review - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <link href="../../css/design-system.css" rel="stylesheet">
    <link href="../../css/admin.css" rel="stylesheet">
    <script src="../../js/ui.js" defer></script>
</head>

<body class="app-loading" data-role="admin" data-page-title="Property Approvals">
    <main class="dashboard-container admin-properties-page" aria-labelledby="appPageTitle">
        <!-- Subnav Filter Tabs Bar -->
        <div class="review-tabs-bar" role="tablist" aria-label="Filter property review queue">
            <button type="button" role="tab" aria-selected="true" onclick="switchTab('all')" id="tab-all" class="review-tab-btn active">
                <span>All Listings</span>
                <span class="review-tab-count" id="tabCountAll">0</span>
            </button>
            <button type="button" role="tab" aria-selected="false" onclick="switchTab('pending_review')" id="tab-pending_review" class="review-tab-btn">
                <span>Pending Review</span>
                <span class="review-tab-count" id="tabCountPending">0</span>
            </button>
            <button type="button" role="tab" aria-selected="false" onclick="switchTab('approved')" id="tab-approved" class="review-tab-btn">
                <span>Approved</span>
                <span class="review-tab-count" id="tabCountApproved">0</span>
            </button>
            <button type="button" role="tab" aria-selected="false" onclick="switchTab('rejected')" id="tab-rejected" class="review-tab-btn">
                <span>Rejected</span>
                <span class="review-tab-count" id="tabCountRejected">0</span>
            </button>
        </div>

        <!-- Modern Table Card with Integrated Search Controls -->
        <div class="table-card admin-table-card review-card">
            <div class="admin-table-controls">
                <input type="search" id="propertySearchInput" class="form-input admin-table-search" placeholder="Search property, landlord, address..." aria-label="Search properties">
                <select id="propertyTypeFilter" class="form-input admin-table-type-filter" aria-label="Filter by property type">
                    <option value="all">All Types</option>
                    <option value="apartment">Apartment</option>
                    <option value="dormitory">Dormitory</option>
                    <option value="boarding_house">Boarding House</option>
                    <option value="room">Room</option>
                    <option value="house">House</option>
                    <option value="commercial">Commercial</option>
                </select>
                <span class="admin-table-result-count" id="propertyResultCount" aria-live="polite">Loading properties…</span>
            </div>

            <div class="ui-table-wrapper admin-table-scroll">
                <table class="admin-data-table admin-record-table">
                    <thead>
                        <tr>
                            <th style="width: 27%;">Property details</th>
                            <th style="width: 20%;">Landlord</th>
                            <th style="width: 21%;">Address &amp; Location</th>
                            <th style="width: 10%; text-align: center;">Docs</th>
                            <th style="width: 11%; text-align: center;">Submitted</th>
                            <th style="width: 11%; text-align: center;">Status</th>
                            <th style="width: 110px; min-width: 110px; text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="propertiesTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--color-text-muted); padding: 48px 20px;">
                                <div class="admin-table-loading">
                                    <span>Loading registered properties queue…</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script src="../../js/admin.js" defer></script>
    <script>
        const token = localStorage.getItem('domiknow_token');
        let allProperties = [];
        let activeTabFilter = 'all';
        let searchQuery = '';
        let typeFilter = 'all';

        function escapeHtml(str) {
            if (typeof window.domiknowEscapeHtml === 'function') {
                return window.domiknowEscapeHtml(str);
            }
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatType(type) {
            return String(type || 'Unknown').replace(/_/g, ' ');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) return;
            fetchPropertiesReviewList();

            const searchInput = document.getElementById('propertySearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.trim().toLowerCase();
                    renderTable();
                });
            }

            const typeSelect = document.getElementById('propertyTypeFilter');
            if (typeSelect) {
                typeSelect.addEventListener('change', (e) => {
                    typeFilter = e.target.value;
                    renderTable();
                });
            }
        });

        async function fetchPropertiesReviewList() {
            const tableBody = document.getElementById('propertiesTableBody');
            try {
                const response = await fetch('/api/admin/properties/review', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--color-danger, #ef4444); padding: 32px;">Failed to load review registry.</td></tr>`;
                    return;
                }

                const result = await response.json();
                allProperties = result.data || [];
                updateKpis(allProperties);
                renderTable();

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--color-danger, #ef4444); padding: 32px;">Error reaching admin servers.</td></tr>`;
            }
        }

        function updateKpis(properties) {
            const total = properties.length;
            const pending = properties.filter(p => p.status === 'pending_review').length;
            const approved = properties.filter(p => p.status === 'approved').length;
            const rejected = properties.filter(p => p.status === 'rejected').length;

            const tabAll = document.getElementById('tabCountAll');
            const tabPending = document.getElementById('tabCountPending');
            const tabApproved = document.getElementById('tabCountApproved');
            const tabRejected = document.getElementById('tabCountRejected');

            if (tabAll) tabAll.textContent = total;
            if (tabPending) tabPending.textContent = pending;
            if (tabApproved) tabApproved.textContent = approved;
            if (tabRejected) tabRejected.textContent = rejected;
        }

        function switchTab(status) {
            activeTabFilter = status;

            document.querySelectorAll('.review-tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            const activeTab = document.getElementById(`tab-${status}`);
            if (activeTab) {
                activeTab.classList.add('active');
                activeTab.setAttribute('aria-selected', 'true');
            }

            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('propertiesTableBody');
            if (!tableBody) return;

            let filtered = allProperties;

            // 1. Tab status filter
            if (activeTabFilter !== 'all') {
                filtered = filtered.filter(p => p.status === activeTabFilter);
            }

            // 2. Property type filter
            if (typeFilter !== 'all') {
                filtered = filtered.filter(p => (p.property_type || '').toLowerCase() === typeFilter.toLowerCase());
            }

            // 3. Search query filter
            if (searchQuery) {
                filtered = filtered.filter(p => {
                    const name = (p.property_name || '').toLowerCase();
                    const landlord = (p.landlord_name || '').toLowerCase();
                    const email = (p.landlord_email || '').toLowerCase();
                    const addr = (p.address || '').toLowerCase();
                    const brgy = (p.barangay || '').toLowerCase();
                    const type = (p.property_type || '').toLowerCase();
                    return name.includes(searchQuery) ||
                           landlord.includes(searchQuery) ||
                           email.includes(searchQuery) ||
                           addr.includes(searchQuery) ||
                           brgy.includes(searchQuery) ||
                           type.includes(searchQuery);
                });
            }

            // Update counter
            const counter = document.getElementById('propertyResultCount');
            if (counter) {
                counter.textContent = `${filtered.length} ${filtered.length === 1 ? 'property' : 'properties'} shown`;
            }

            tableBody.innerHTML = '';

            if (filtered.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="admin-table-empty">
                            <div class="empty-state-icon" aria-hidden="true">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            </div>
                            <h3>No properties found in this queue</h3>
                            <p>No listings match your active tab, property type, or search terms.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(prop => {
                let statusClass = 'status-pending';
                let statusLabel = 'Pending Review';
                if (prop.status === 'approved') {
                    statusClass = 'status-active';
                    statusLabel = 'Approved';
                } else if (prop.status === 'rejected') {
                    statusClass = 'status-rejected';
                    statusLabel = 'Rejected';
                }

                const registeredDate = prop.created_at
                    ? new Date(prop.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
                    : 'N/A';

                const docCount = (prop.document_count !== undefined) ? prop.document_count : (prop.documents_count || 0);
                const locationText = prop.address
                    ? `${prop.address}${prop.barangay ? `, Brgy. ${prop.barangay}` : ''}, Siniloan`
                    : (prop.barangay ? `Brgy. ${prop.barangay}, Siniloan` : 'Siniloan, Laguna');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="property-identity-cell">
                            <span class="property-avatar-badge" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            </span>
                            <div style="min-width: 0;">
                                <strong class="property-name-text">${escapeHtml(prop.property_name || 'Unnamed Property')}</strong>
                                <div class="property-meta-row">
                                    <span class="property-type-pill">${escapeHtml(formatType(prop.property_type))}</span>
                                    ${prop.image_count ? `<span class="photo-count-chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> ${prop.image_count} photo${prop.image_count > 1 ? 's' : ''}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="landlord-cell">
                            <strong class="landlord-name-text">${escapeHtml(prop.landlord_name || 'Unknown Landlord')}</strong>
                            <div class="landlord-email-text">${escapeHtml(prop.landlord_email || 'No email')}</div>
                            ${prop.landlord_phone && prop.landlord_phone !== 'N/A' ? `<div class="landlord-phone-text"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>${escapeHtml(prop.landlord_phone)}</span></div>` : ''}
                        </div>
                    </td>
                    <td>
                        <div class="property-location-cell">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span>${escapeHtml(locationText)}</span>
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <span class="doc-chip ${docCount > 0 ? 'doc-chip--has-docs' : 'doc-chip--no-docs'}">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            ${docCount} ${docCount === 1 ? 'doc' : 'docs'}
                        </span>
                    </td>
                    <td style="text-align: center;">
                        <span class="user-date-text">${registeredDate}</span>
                    </td>
                    <td style="text-align: center;">
                        <span class="status-badge ${statusClass}">${escapeHtml(statusLabel)}</span>
                    </td>
                    <td style="text-align: right; white-space: nowrap;">
                        <a href="property-review-details.html?id=${encodeURIComponent(prop.id)}" class="btn-action-verify">
                            <span>Inspect</span>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </a>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>
</body>

</html>
