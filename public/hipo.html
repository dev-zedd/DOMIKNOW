<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMIKNOW - Hierarchical Input Process Output (HIPO) Model</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f3f5;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        header {
            background-color: #ffffff;
            border-bottom: 2px solid #111827;
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-wrap {
            max-width: 1560px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .title-group p {
            font-size: 0.8rem;
            color: #4b5563;
            margin-top: 2px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #ffffff;
            color: #111827;
            border: 1.5px solid #111827;
            padding: 7px 14px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #111827;
            color: #ffffff;
        }

        .btn-active {
            background-color: #111827;
            color: #ffffff;
        }

        /* Controls / Sub-Bar */
        .controls-bar {
            max-width: 1560px;
            margin: 14px auto 0;
            padding: 0 24px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zoom-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            border: 1.5px solid #111827;
            border-radius: 4px;
            padding: 2px 6px;
        }

        .zoom-btn {
            background: transparent;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            background: #f3f4f6;
        }

        .zoom-label {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 0 6px;
        }

        /* Workspace & Canvas */
        .workspace {
            max-width: 1560px;
            width: 100%;
            margin: 14px auto 30px;
            padding: 0 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .paper-sheet {
            background-color: #ffffff;
            border: 1px solid #9ca3af;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: auto;
            max-width: 100%;
            border-radius: 3px;
        }

        .hipo-svg {
            display: block;
            background-color: #ffffff;
            transition: transform 0.2s ease-out;
            transform-origin: top center;
        }

        /* Toast Feedback */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #111827;
            color: #ffffff;
            padding: 11px 20px;
            border-radius: 4px;
            font-size: 0.86rem;
            font-weight: bold;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.25s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* Print Media Styles */
        @media print {
            header, .controls-bar, .toast {
                display: none !important;
            }
            body, .workspace, .paper-sheet {
                background: #ffffff !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .hipo-svg {
                transform: scale(1) !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-wrap">
            <div class="title-group">
                <h1>DOMIKNOW &bull; HIPO MODEL</h1>
                <p>Hierarchical Input Process Output Architecture &bull; Complete System Decomposition</p>
            </div>

            <div class="btn-group">
                <a href="flowcharts.html" class="btn" title="View Process Flows">
                    Process Flows
                </a>
                <a href="usecase.html" class="btn" title="View Use Case Diagram">
                    Use Case
                </a>
                <a href="architecture.html" class="btn" title="View Context & DFD">
                    Context &amp; DFD
                </a>
                <button class="btn" onclick="copyCurrentToClipboard()" title="Copy high-res PNG image to clipboard for Word/Docs">
                    Copy PNG
                </button>
                <button class="btn btn-active" onclick="downloadCurrentPNG()" title="Download high-resolution 300 DPI PNG">
                    Download PNG
                </button>
                <button class="btn" onclick="window.print()" title="Print page or save as PDF">
                    Print / PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="mode-toggle">
            <span style="font-weight: bold; font-size: 0.85rem;">Diagram:</span>
            <span style="font-size: 0.82rem; color: #4b5563;">Complete 6-Module Hierarchical Input Process Output Decomposition</span>
        </div>

        <div class="zoom-wrap">
            <button class="zoom-btn" onclick="zoom(-0.1)" title="Zoom Out">−</button>
            <span class="zoom-label" id="zoomText">100%</span>
            <button class="zoom-btn" onclick="zoom(0.1)" title="Zoom In">+</button>
            <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom">⟲</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="workspace">
        <div class="paper-sheet" id="paperSheet">
            <div id="svgContainer"></div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast">Diagram PNG exported successfully!</div>

    <script>
        let currentScale = 1.0;

        // Shared SVG Defs
        const svgDefs = `
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
            </marker>
        </defs>`;

        // Helper: Render an IPO Column (Sub-function header + Input + Process + Output)
        function renderIpoColumn(x, ySub, w, subNum, subTitle, inputLines, processLines, outputLines) {
            const hSub = 38;
            const hIn = 95;
            const hProc = 105;
            const hOut = 95;

            const yIn = ySub + hSub + 18;
            const yProc = yIn + hIn + 20;
            const yOut = yProc + hProc + 20;
            const midX = x + w / 2;

            let svg = `
            <g class="ipo-column">
                <!-- Sub-function Header Card -->
                <rect x="${x}" y="${ySub}" width="${w}" height="${hSub}" rx="3" fill="#2563eb" stroke="#1b4f72" stroke-width="1.3" />
                <text x="${midX}" y="${ySub + 15}" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">${subNum}</text>
                <text x="${midX}" y="${ySub + 29}" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e0f2fe">${subTitle}</text>

                <!-- Connector: Sub -> Input -->
                <line x1="${midX}" y1="${ySub + hSub}" x2="${midX}" y2="${yIn}" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)" />

                <!-- INPUT Card -->
                <rect x="${x}" y="${yIn}" width="${w}" height="${hIn}" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
                <rect x="${x + 6}" y="${yIn + 6}" width="42" height="15" rx="2" fill="#dbeafe" />
                <text x="${x + 27}" y="${yIn + 17}" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1e40af">INPUT</text>`;
            
            let curY = yIn + 34;
            for (const line of inputLines) {
                svg += `<text x="${midX}" y="${curY}" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.8" fill="#1e293b">${line}</text>`;
                curY += 14;
            }

            // Connector: Input -> Process
            svg += `<line x1="${midX}" y1="${yIn + hIn}" x2="${midX}" y2="${yProc}" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)" />`;

            // PROCESS Card
            svg += `
                <rect x="${x}" y="${yProc}" width="${w}" height="${hProc}" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1" />
                <rect x="${x + 6}" y="${yProc + 6}" width="54" height="15" rx="2" fill="#d1fae5" />
                <text x="${x + 33}" y="${yProc + 17}" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#065f46">PROCESS</text>`;
            
            curY = yProc + 34;
            for (const line of processLines) {
                svg += `<text x="${midX}" y="${curY}" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.8" fill="#1e293b">${line}</text>`;
                curY += 14;
            }

            // Connector: Process -> Output
            svg += `<line x1="${midX}" y1="${yProc + hProc}" x2="${midX}" y2="${yOut}" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)" />`;

            // OUTPUT Card
            svg += `
                <rect x="${x}" y="${yOut}" width="${w}" height="${hOut}" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.1" />
                <rect x="${x + 6}" y="${yOut + 6}" width="50" height="15" rx="2" fill="#fef9c3" />
                <text x="${x + 31}" y="${yOut + 17}" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#854d0e">OUTPUT</text>`;
            
            curY = yOut + 34;
            for (const line of outputLines) {
                svg += `<text x="${midX}" y="${curY}" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.8" fill="#14532d">${line}</text>`;
                curY += 14;
            }

            svg += `</g>`;
            return svg;
        }

        // Generate Complete HIPO SVG
        function getHipoSVG() {
            const W = 1860;
            const H = 760;

            let svg = `<svg id="activeFlowchart" class="hipo-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
            svg += svgDefs;
            svg += `<rect width="${W}" height="${H}" fill="#ffffff" />`;

            // Outer Bounding Border
            svg += `<rect x="25" y="25" width="${W - 50}" height="${H - 50}" fill="#ffffff" stroke="#111827" stroke-width="1.4" />`;

            // ROOT NODE: DOMIKNOW SYSTEM (Centered at Top)
            const rW = 760, rH = 50;
            const rX = (W - rW) / 2, rY = 45;
            svg += `
            <g class="root-node">
                <rect x="${rX}" y="${rY}" width="${rW}" height="${rH}" rx="5" fill="#1b4f72" stroke="#0f172a" stroke-width="2" />
                <text x="${W / 2}" y="${rY + 22}" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" letter-spacing="1">DOMIKNOW: PROPERTY &amp; RENTAL MANAGEMENT PLATFORM</text>
                <text x="${W / 2}" y="${rY + 38}" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#bae6fd">HIERARCHICAL INPUT PROCESS OUTPUT (HIPO) DECOMPOSITION MODEL</text>
            </g>`;

            // Hierarchy Distribution Bus Lines
            const stemBotY = 120;
            // Vertical stem down from root
            svg += `<line x1="${W / 2}" y1="${rY + rH}" x2="${W / 2}" y2="${stemBotY}" stroke="#111827" stroke-width="1.8" />`;

            // Module Coordinates (6 Modules across 1860 width)
            // Each module spans 280px with ~20px gap between modules
            const modWidth = 280;
            const modGap = 20;
            const totalModsWidth = (6 * modWidth) + (5 * modGap); // 1680 + 100 = 1780
            const startX = (W - totalModsWidth) / 2; // (1860 - 1780) / 2 = 40px

            const modCenters = [];
            for (let i = 0; i < 6; i++) {
                const mX = startX + i * (modWidth + modGap);
                modCenters.push(mX + modWidth / 2);
            }

            // Horizontal distribution bus across all 6 module centers
            svg += `<line x1="${modCenters[0]}" y1="${stemBotY}" x2="${modCenters[5]}" y2="${stemBotY}" stroke="#111827" stroke-width="1.8" />`;

            // Module Definitions
            const modules = [
                {
                    title: "1.0 AUTHENTICATION & KYC",
                    subtext: "User Security & Session Management",
                    sub1: {
                        num: "1.1 User Login & Session",
                        title: "Credential Auth & JWT",
                        in: ["Email & password", "Role access request"],
                        proc: ["Validate input fields", "Verify bcrypt hash", "Generate signed JWT"],
                        out: ["Authenticated token", "Role dashboard view"]
                    },
                    sub2: {
                        num: "1.2 KYC & Registration",
                        title: "User Profile & ID Verification",
                        in: ["User registration data", "Valid ID document photo"],
                        proc: ["Sanitize user inputs", "Store profile records", "Flag pending KYC"],
                        out: ["Registered account", "Verified user profile"]
                    }
                },
                {
                    title: "2.0 PROPERTY & UNITS",
                    subtext: "Listing Inventory & Moderation",
                    sub1: {
                        num: "2.1 Property Listing",
                        title: "Unit Inventory & Geocoding",
                        in: ["Property specifications", "Pricing, rooms & photos", "Street address"],
                        proc: ["Validate property details", "Geocode address (OSM)", "Save unit records"],
                        out: ["Published property", "Live unit inventory"]
                    },
                    sub2: {
                        num: "2.2 Admin Moderation",
                        title: "Listing Compliance Review",
                        in: ["Submitted listing request", "Proof of ownership"],
                        proc: ["Review property details", "Verify compliance terms", "Update approval status"],
                        out: ["Approved listing record", "Landlord notification"]
                    }
                },
                {
                    title: "3.0 RECOMMENDATION ENGINE",
                    subtext: "Multi-Criteria Algorithmic Matching",
                    sub1: {
                        num: "3.1 Preference Collection",
                        title: "Decision Matrix Formulation",
                        in: ["Budget range preference", "Target location & room", "Desired amenities"],
                        proc: ["Normalize preference data", "Assign criteria weights", "Filter valid properties"],
                        out: ["Normalized criteria matrix", "Candidate property set"]
                    },
                    sub2: {
                        num: "3.2 TOPSIS Scoring",
                        title: "Weighted Ranking Calculation",
                        in: ["Criteria decision matrix", "Ideal & negative solutions"],
                        proc: ["Compute Euclidean distance", "Calculate relative closeness", "Sort by TOPSIS score"],
                        out: ["Ranked recommendations", "Match % score feed"]
                    }
                },
                {
                    title: "4.0 LEASE & TENANCY",
                    subtext: "Digital Contracts & Applications",
                    sub1: {
                        num: "4.1 Rental Application",
                        title: "Tenant Screening & Request",
                        in: ["Rental application form", "Proof of income / ID"],
                        proc: ["Verify requirements", "Notify landlord reviewer", "Record screening log"],
                        out: ["Application status", "Screening decision notice"]
                    },
                    sub2: {
                        num: "4.2 Digital Agreement",
                        title: "Binding Lease Contract",
                        in: ["Lease duration & terms", "Deposit & monthly rent", "Digital signatures"],
                        proc: ["Generate legal agreement", "Bind digital signatures", "Lock tenancy dates"],
                        out: ["Executed digital lease", "Active tenancy record"]
                    }
                },
                {
                    title: "5.0 BILLING & SUBMETER",
                    subtext: "Utility Logs & Payment Receipts",
                    sub1: {
                        num: "5.1 Submeter Recording",
                        title: "Utility Consumption Log",
                        in: ["Electric/Water readings", "Submeter dial photo proof"],
                        proc: ["Compute usage difference", "Apply kilowatt/cubic rate", "Generate utility charge"],
                        out: ["Calculated utility bill", "Logged consumption record"]
                    },
                    sub2: {
                        num: "5.2 Rent Billing & Payment",
                        title: "Receipt Verification",
                        in: ["Active lease rent charges", "Payment receipt upload"],
                        proc: ["Consolidate total SOA", "Verify payment receipt", "Mark invoice as settled"],
                        out: ["Official payment receipt", "Updated balance & SOA"]
                    }
                },
                {
                    title: "6.0 MAINTENANCE & GOV",
                    subtext: "Work Orders, Disputes & Audits",
                    sub1: {
                        num: "6.1 Maintenance Tickets",
                        title: "Work Order Dispatch",
                        in: ["Repair issue description", "Urgency level & photos"],
                        proc: ["Log maintenance ticket", "Dispatch to personnel", "Update progress status"],
                        out: ["Assigned repair order", "Live status tracker"]
                    },
                    sub2: {
                        num: "6.2 Dispute & Audit Logs",
                        title: "Case Triage & Security Audit",
                        in: ["Dispute complaint details", "System event metadata"],
                        proc: ["Route to admin triage", "Arbitrate reported issue", "Append immutable audit log"],
                        out: ["Dispute resolution report", "System audit trail record"]
                    }
                }
            ];

            const modHeaderH = 44;
            const modHeaderY = 145;
            const colW = 132;
            const colGap = 12;

            for (let i = 0; i < 6; i++) {
                const mX = startX + i * (modWidth + modGap);
                const cX = modCenters[i];
                const mod = modules[i];

                // Drop line from bus to module header
                svg += `<line x1="${cX}" y1="${stemBotY}" x2="${cX}" y2="${modHeaderY}" stroke="#111827" stroke-width="1.6" />`;

                // Module Header Card
                svg += `
                <g class="module-header">
                    <rect x="${mX}" y="${modHeaderY}" width="${modWidth}" height="${modHeaderH}" rx="4" fill="#4da8da" stroke="#1b4f72" stroke-width="1.6" />
                    <text x="${cX}" y="${modHeaderY + 18}" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" letter-spacing="0.5">${mod.title}</text>
                    <text x="${cX}" y="${modHeaderY + 33}" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f0f9ff">${mod.subtext}</text>
                </g>`;

                // Sub-function Distribution Bus
                const subBusY = modHeaderY + modHeaderH + 15;
                const sub1X = mX + 2;
                const sub2X = sub1X + colW + colGap;
                const sub1Mid = sub1X + colW / 2;
                const sub2Mid = sub2X + colW / 2;

                // Vertical drop from Module Header to Sub-bus
                svg += `<line x1="${cX}" y1="${modHeaderY + modHeaderH}" x2="${cX}" y2="${subBusY}" stroke="#111827" stroke-width="1.4" />`;
                // Horizontal Sub-bus
                svg += `<line x1="${sub1Mid}" y1="${subBusY}" x2="${sub2Mid}" y2="${subBusY}" stroke="#111827" stroke-width="1.4" />`;
                // Drops to Sub 1 and Sub 2 headers
                const ySub = subBusY + 12;
                svg += `<line x1="${sub1Mid}" y1="${subBusY}" x2="${sub1Mid}" y2="${ySub}" stroke="#111827" stroke-width="1.4" />`;
                svg += `<line x1="${sub2Mid}" y1="${subBusY}" x2="${sub2Mid}" y2="${ySub}" stroke="#111827" stroke-width="1.4" />`;

                // Render IPO Columns
                svg += renderIpoColumn(sub1X, ySub, colW, mod.sub1.num, mod.sub1.title, mod.sub1.in, mod.sub1.proc, mod.sub1.out);
                svg += renderIpoColumn(sub2X, ySub, colW, mod.sub2.num, mod.sub2.title, mod.sub2.in, mod.sub2.proc, mod.sub2.out);
            }

            svg += `</svg>`;
            return svg;
        }

        // Render Diagram
        function renderCurrent() {
            document.getElementById('svgContainer').innerHTML = getHipoSVG();
            applyZoom();
        }

        // Zoom Logic
        function zoom(delta) {
            currentScale = Math.min(Math.max(currentScale + delta, 0.4), 2.2);
            applyZoom();
        }

        function resetZoom() {
            currentScale = 1.0;
            applyZoom();
        }

        function applyZoom() {
            document.getElementById('zoomText').innerText = Math.round(currentScale * 100) + '%';
            const svg = document.querySelector('#svgContainer svg');
            if (svg) svg.style.transform = `scale(${currentScale})`;
        }

        // Toast Feedback
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // High Resolution PNG Converter (Canvas 300 DPI)
        function getSVGToCanvas(svgElement, scaleMultiplier = 2.2) {
            return new Promise((resolve, reject) => {
                try {
                    const serializer = new XMLSerializer();
                    let svgStr = serializer.serializeToString(svgElement);
                    if (!svgStr.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                        svgStr = svgStr.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
                    }

                    const width = svgElement.viewBox.baseVal.width || 1860;
                    const height = svgElement.viewBox.baseVal.height || 760;

                    const canvas = document.createElement('canvas');
                    canvas.width = width * scaleMultiplier;
                    canvas.height = height * scaleMultiplier;
                    const ctx = canvas.getContext('2d');

                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const img = new Image();
                    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(blob);

                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        URL.revokeObjectURL(url);
                        resolve({ canvas, dataURL: canvas.toDataURL('image/png') });
                    };

                    img.onerror = (e) => {
                        URL.revokeObjectURL(url);
                        reject(e);
                    };

                    img.src = url;
                } catch (err) {
                    reject(err);
                }
            });
        }

        // Download Single PNG
        async function downloadCurrentPNG() {
            const svg = document.querySelector('#svgContainer svg');
            if (!svg) return;
            showToast("Generating crisp thesis-ready PNG...");
            try {
                const { dataURL } = await getSVGToCanvas(svg, 2.2);
                const filename = "DOMIKNOW_HIPO_Model.png";
                const a = document.createElement('a');
                a.href = dataURL;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`Downloaded ${filename} successfully!`);
            } catch (err) {
                console.error(err);
                showToast("Failed to generate image.");
            }
        }

        // Copy Single PNG to Clipboard
        async function copyCurrentToClipboard() {
            const svg = document.querySelector('#svgContainer svg');
            if (!svg) return;
            showToast("Rendering to clipboard...");
            try {
                const { canvas } = await getSVGToCanvas(svg, 2.0);
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        showToast("Copied PNG directly to clipboard! Ready to paste (Ctrl+V) in Word or Docs.");
                    } catch (e) {
                        downloadCurrentPNG();
                    }
                }, "image/png");
            } catch (err) {
                showToast("Clipboard copy failed.");
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            renderCurrent();
        });
    </script>
</body>
